# A tool the LLM can call, defined entirely in YAML. No Python, no restart of
# anything but Jarvis.
#
# Every *.tool.yaml in this directory is loaded because configuration.yaml sets
# `llm: tools_dir: tools`. One file may hold a single tool (this one) or a YAML
# list of them.
#
# HOW IT WORKS
#   The `fields:` become the JSON schema the model fills in. Their values are
#   rendered into `url` (percent-encoded), `headers` and `payload` (verbatim)
#   as Jinja templates, the request goes out, and the JSON response comes back
#   to the model wrapped with a reminder that external data is information and
#   never instructions.
#
# TIERS — this is the safety dial:
#   1  direct      run it now, answer in the same turn. Reads, lookups, queries.
#   2  background  long-running; Jarvis acknowledges and reports back later.
#   3  approval    NEVER runs from a model turn. Returns approval_required and
#                  a request id, and waits for a human to approve it out of
#                  band. Use for anything that spends money, sends a message,
#                  opens a door, or cannot be undone.
#   The automatic "targets land in a gated domain (lock, notify) => tier 3"
#   rule belongs to the built-in entity tools, which resolve entity ids before
#   they act. A YAML tool has no targets to resolve — it makes an HTTP request
#   — so nothing here is upgraded for you. If the endpoint opens a door or
#   sends a message, say so yourself: set `tier: 3`, or add a top-level
#   `domain: lock` / `domain: notify`, either of which makes the registry hold
#   the call for a human.
#
# CREDENTIALS
#   Manifests in this directory are read with a plain YAML parser, so !secret
#   and !env_var do NOT work here. A tool that needs a credential belongs in
#   the inline `llm: tools:` block in configuration.yaml, which is loaded with
#   the full Jarvis loader and can reference secrets.yaml. The tool below needs
#   no credential, which is why it lives here.

name: find_place
description: >-
  Look up a place, address or landmark and get its coordinates and full
  address. Use this before any question about where something is or how far
  away it is. Returns several candidates, best match first.
tier: 1

service:
  method: GET
  # photon, from docker-compose.yml. Entirely offline: the geocoding index is
  # on this machine, so a location lookup never leaves the house.
  # `| default(5)` matters: an optional field the model leaves out is absent
  # from the render context, so a bare {{ limit }} becomes the empty string and
  # the request goes out as `&limit=&lang=en`. Give every optional field a
  # default in the template, not only an `example:`.
  url: "http://127.0.0.1:2322/api?q={{ query }}&limit={{ limit | default(5) }}&lang=en"
  timeout: 10
  fields:
    query:
      description: The place to look for — a name, an address, or a landmark.
      example: Kings Cross station
      required: true
    limit:
      description: How many candidates to return, 1 to 10. Defaults to 5.
      type: integer
      example: 5

# ---------------------------------------------------------------------------
