# jarvis-core — the full standalone stack. One `docker compose up -d`.
#
# This file REPLACES the `homeassistant` service in your existing compose and
# keeps everything else. The four Wyoming/photon services below are reproduced
# from that stack unchanged, so you can point at this file and delete the old
# one rather than running both.
#
#   jarvis-core             :8080   automation engine + REST/WS API + HUD
#   wyoming-openwakeword    :10400  wake word ("hey jarvis")
#   wyoming-whisper         :10300  speech to text
#   wyoming-piper           :10200  text to speech
#   photon                  :2322   offline geocoder
#   jarvis-browser          :8210   fetching, crawling, gated browser automation
#   searxng                 :8888   private metasearch  (profile: search)
#   ollama                  :11434  the model (commented — usually on the host)
#
# SearXNG is behind a compose profile, so it is opt-in:
#
#   docker compose --profile search up -d      # brings SearXNG up too
#   docker compose up -d                       # without it — then point
#                                              # SEARXNG_URL at an existing one
#
# Everything else starts either way. See searxng/README.md and docs/search.md.
#
# Everything is `network_mode: host`, matching the existing stack. Under host
# mode `ports:` is ignored: the port a service binds is what is reachable, and
# ufw is what decides who may reach it (scripts/apply-firewall.sh in the parent
# repo). Nothing here should ever be port-forwarded from the internet — see
# docs/security.md.
#
# Model/flag defaults come from environment variables so you can keep whatever
# your host already runs without editing this file:
#
#   WHISPER_MODEL=... PIPER_VOICE=... WAKE_WORD=... docker compose up -d
#
# or put them in a .env next to this file.
#
# Two defaults below are not free choices — they must agree with
# config/configuration.yaml, and tests/test_packaging.py fails the build if
# they drift:
#
#   TZ           == jarvis: time_zone:   (see below)
#   PIPER_VOICE  == voice: tts: voice:   (or the default pipeline asks Piper
#                                         for a voice it was never given)
#
# TZ used to be the load-bearing one: `time_zone:` was echoed back by
# /api/config and read by nothing, so the container's TZ decided when
# `at: "07:00:00"` fired and a disagreement moved every time trigger silently.
# `time_zone:` now drives the automation clock and `{{ now() }}` directly, so
# it is the setting that counts and the console can offer it honestly. TZ is
# kept in step anyway: it still sets the zone in this container's log
# timestamps and in every other container here, none of which read Jarvis's
# configuration.
#
# Every bind mount here is a relative path, so its host side lands inside the
# Docker build context. Anything added must also be listed in .dockerignore.

services:
  # --- Jarvis Core --------------------------------------------------------
  # The whole platform: state machine, service registry, automations, scripts,
  # scenes, MQTT discovery, recorder, the voice pipeline and the LLM agent.
  # --- one-shot: make the bind-mounted config dir writable ------------------
  # jarvis-core runs as uid 10003 (see Dockerfile) and never as root. `./config`
  # is a bind mount, so its ownership is the HOST's — whatever the user who
  # cloned the repo happens to be, usually root. The Dockerfile's `chown /config`
  # applies to the image's empty directory and is masked the instant the mount
  # lands on top of it, so without this the very first write fails:
  #
  #     PermissionError: [Errno 13] Permission denied: '/config/.storage'
  #
  # ...and `restart: unless-stopped` turns that into a crash loop that buries
  # the cause under identical tracebacks. Runs as root, chowns, exits.
  jarvis-config-init:
    image: busybox:1.36
    container_name: jarvis-config-init
    user: "0:0"
    command: >
      sh -c "mkdir -p /config/.storage /config/workspaces &&
             chown -R 10003:10003 /config &&
             echo 'config dir ready for uid 10003'"
    volumes:
      - ./config:/config
    restart: "no"

  jarvis-core:
    # Built here, never published: without this compose tries a registry
    # pull first and prints a scary "access denied" warning before falling
    # back to building anyway.
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis-core:local
    container_name: jarvis-core
    restart: unless-stopped
    # Host networking is load-bearing, not laziness. Jarvis has to reach the
    # Wyoming sockets and Ollama on 127.0.0.1, and MQTT/mDNS discovery of
    # Zigbee2MQTT, ESPHome, Shelly and WLED devices needs to be on the LAN
    # broadcast domain rather than behind a NAT bridge.
    network_mode: host
    environment:
      # Where Ollama is. Loopback by default because it is usually on the host;
      # with `network_mode: host` a container or LAN address works unchanged.
      # `LLM_URL` and `LLM_MODEL` are the same two knobs under the names that
      # make sense once the server is not Ollama — LiteLLM, vLLM, llama.cpp,
      # LM Studio, TGI, SGLang all work here. They feed the SAME container
      # variables, so an install that has only ever set `OLLAMA_URL` is
      # unchanged, and nothing has to read two names.
      #
      # Set `backend: openai` in the `llm:` block of configuration.yaml as
      # well; the url alone only switches wires when it ends in `/v1`. See
      # docs/openai-compat.md.
      - OLLAMA_URL=${LLM_URL:-${OLLAMA_URL:-http://127.0.0.1:11434}}
      - OLLAMA_MODEL=${LLM_MODEL:-${OLLAMA_MODEL:-qwen3:8b}}
      # The proxy's key, if it has one. Ignored on the Ollama wire, so it is
      # safe to leave set.
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Named zone for time-of-day triggers and the sun integration. Keep this
      # in step with `jarvis: time_zone:` in config/configuration.yaml.
      - TZ=${TZ:-Europe/London}
      # Optional. Unset (the normal case) means Jarvis mints a token on first
      # run and prints it in a banner — see the README quickstart. Set it to
      # pin a known token instead, e.g. when rebuilding from scratch often.
      - JARVIS_TOKEN=${JARVIS_TOKEN:-}
      # Pairing a phone by scanning a QR in the console. Unset means off.
      #
      # A SECOND secret, deliberately — the same shape as ORCHESTRATOR_TOKEN vs
      # APPROVAL_SECRET next door, and for the same reason. jarvis-web's relay
      # attaches JARVIS_TOKEN to whatever connects to it, so possession of the
      # API token cannot be what decides whether a permanent new token may be
      # minted. jarvis-web never receives this one: it is typed into the pairing
      # panel and forwarded.
      - JARVIS_PAIRING_SECRET=${JARVIS_PAIRING_SECRET:-}
      # --- everything config/configuration.yaml reads with !env_var ---------
      # These are not optional extras: the shipped configuration.yaml resolves
      # them at load time, and a variable that never enters this container is
      # an empty setting no matter what .env says. Without them Jarvis boots
      # with no browser token and reports "not configured" for web.fetch,
      # web.crawl and web.browse for ever, on a host where jarvis-browser is
      # up and healthy. tests/test_packaging.py fails the build if the two
      # files drift apart again.
      - SEARXNG_URL=${SEARXNG_URL:-http://127.0.0.1:8888}
      # The same pair jarvis-browser gets, and for the same reason: Jarvis is
      # the client. Keep them DIFFERENT values — holding the API token must
      # not be enough to approve a click on "Pay".
      - JARVIS_BROWSER_TOKEN=${JARVIS_BROWSER_TOKEN:-}
      - BROWSER_APPROVAL_SECRET=${BROWSER_APPROVAL_SECRET:-}
      # The orchestrator pair. Its services are commented out below, so these
      # are normally empty and the tools answer "not configured" — but the
      # config reads them either way, and an operator who uncomments the
      # service needs them arriving here too.
      - ORCHESTRATOR_TOKEN=${ORCHESTRATOR_TOKEN:-}
      - APPROVAL_SECRET=${APPROVAL_SECRET:-}
      # n8n's API key, if you point Jarvis at an n8n (`n8n: url:` in
      # configuration.yaml). Settings -> n8n API -> Create an API key.
      # Unset means the n8n tools answer "point me at an n8n" and do nothing.
      - N8N_API_KEY=${N8N_API_KEY:-}
    depends_on:
      jarvis-config-init:
        condition: service_completed_successfully
    volumes:
      # Your entire installation. Config in, and Jarvis writes .storage/
      # (entity/device/area registries, access tokens), the recorder database
      # and — since Jarvis Code — `workspaces/`, the repositories it creates
      # and clones. Back this directory up; nothing else here is state.
      #
      # `workspaces/` is here and not under the container's `~` for a plain
      # reason: `~` is the image's writable layer, so a rebuild would delete
      # every repository Jarvis had made. The Dockerfile sets
      # JARVIS_CODE_WORKSPACE=/config/workspaces to keep them on this side of
      # the mount.
      - ./config:/config
      # Lets glibc resolve the named zone even when the image's best-effort
      # tzdata install was skipped (blocked apt mirror at build time).
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt: [no-new-privileges:true]
    # Jarvis does not need to escalate, mount, or touch raw devices. If you add
    # an integration that talks to a USB radio (Zigbee coordinator, Z-Wave
    # stick), add the device here explicitly:
    #   devices: ["/dev/ttyUSB0:/dev/ttyUSB0"]
    cap_drop: [ALL]

  # --- Wyoming: wake word -------------------------------------------------
  # Streams audio in, says "the wake word fired" out. `hey_jarvis` ships with
  # the image; custom models trained per docs/wake-word-training.md go in
  # ./openwakeword and are picked up by --custom-model-dir.
  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: wyoming-openwakeword
    restart: unless-stopped
    network_mode: host
    command: >
      --uri tcp://0.0.0.0:10400
      --preload-model ${WAKE_WORD:-hey_jarvis}
      --custom-model-dir /custom
    volumes:
      - ./wyoming/openwakeword:/custom
    environment:
      - TZ=${TZ:-Europe/London}

  # --- Wyoming: speech to text -------------------------------------------
  # This image IS faster-whisper, so WHISPER_MODEL must be one of ITS names:
  # tiny/base/small/medium/large-v3/turbo, each also in an `.en` English-only
  # variant that is more accurate for English and useless for anything else.
  # `base.en` is the default because it is the smallest that transcribes a
  # spoken sentence reliably; `small.en` if you have the RAM, `tiny.en` on a Pi.
  # Set `base` (no suffix) if VOICE_LANGUAGE is not `en`.
  #
  # An invalid name is not a warning — faster-whisper raises ValueError and the
  # container restart-loops. jarvis-core does not care which engine answers on
  # 10300, only that something speaks Wyoming there, so a different STT server
  # is fine; its model names are then that server's business, not this list.
  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: wyoming-whisper
    restart: unless-stopped
    network_mode: host
    command: >
      --uri tcp://0.0.0.0:10300
      --model ${WHISPER_MODEL:-base.en}
      --language ${VOICE_LANGUAGE:-en}
      --data-dir /data
      --download-dir /data
    volumes:
      - ./wyoming/whisper:/data
    environment:
      - TZ=${TZ:-Europe/London}

  # --- Wyoming: text to speech -------------------------------------------
  # Piper. `--voice` is the voice this container LOADS, and it is the one the
  # default pipeline asks for, so it has to equal `voice: tts: voice:` in
  # config/configuration.yaml — en_GB-alan-medium, the voice the Jarvis persona
  # is written for and the one the parent repo's .env.example already sets.
  # A pipeline naming a second voice (the Guest pipeline uses
  # en_US-lessac-medium) makes Piper fetch it on first use into ./wyoming/piper;
  # that request is slow the first time and fails outright with no internet.
  wyoming-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    network_mode: host
    command: >
      --uri tcp://0.0.0.0:10200
      --voice ${PIPER_VOICE:-en_GB-alan-medium}
      --data-dir /data
      --download-dir /data
    volumes:
      - ./wyoming/piper:/data
    environment:
      - TZ=${TZ:-Europe/London}

  # --- Offline geocoder ---------------------------------------------------
  # Place lookups ("how long to the hardware shop?") without calling Google.
  # First start downloads a sizeable planet/country index into ./photon —
  # expect it to sit there a while before it answers.
  photon:
    image: rtuszik/photon-docker:latest
    container_name: photon
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ:-Europe/London}
      # Country extract instead of the full planet index. Unset = planet.
      - REGION=${PHOTON_REGION:-}
      - UPDATE_STRATEGY=${PHOTON_UPDATE_STRATEGY:-PARALLEL}
    volumes:
      - ./photon:/photon/photon_data

  # --- The web: fetching, crawling, gated browser automation --------------
  # Everything Jarvis reads off the internet goes through here, and every byte
  # it returns comes back wrapped in <untrusted_web_content>. The service is
  # the boundary between "the model can read a page" and "the model can click
  # on one": reading is open to any public host, while clicking and typing are
  # confined to BROWSER_ACT_ALLOWLIST (empty = refused everywhere) and anything
  # sensitive needs a human approval carrying a SECOND secret.
  #
  # Both secrets are required — the service refuses to start without them, on
  # the grounds that an unauthenticated browser-automation service on the LAN
  # is a remote-code-execution-shaped hole. Generate them once:
  #
  #   echo "JARVIS_BROWSER_TOKEN=$(openssl rand -hex 32)"    >> .env
  #   echo "BROWSER_APPROVAL_SECRET=$(openssl rand -hex 32)" >> .env
  #
  # Keep them DIFFERENT. The model holds the API token; holding it must not be
  # enough to click "Pay". See ../jarvis-browser/README.md.
  jarvis-browser:
    # Built here, never published: without this compose tries a registry
    # pull first and prints a scary "access denied" warning before falling
    # back to building anyway.
    pull_policy: build
    build: ../jarvis-browser
    image: jarvis-browser:local
    container_name: jarvis-browser
    restart: unless-stopped
    # Host networking for the same reason as everything else here: it binds
    # :8210, and ufw — not Docker's DNAT — decides who may reach it. Treat the
    # port like the orchestrator's: this host and WireGuard, never forwarded.
    network_mode: host
    environment:
      - TZ=${TZ:-Europe/London}
      # Required. Bearer token on every route, /healthz included.
      - JARVIS_BROWSER_TOKEN=${JARVIS_BROWSER_TOKEN:-}
      # Required, and NOT the same value. Only /approve accepts it.
      - BROWSER_APPROVAL_SECRET=${BROWSER_APPROVAL_SECRET:-}
      # Where /search proxies to. Unset => /search 503s with an explanation
      # and never reaches for a cloud engine.
      - SEARXNG_URL=${SEARXNG_URL:-http://127.0.0.1:8888}
      # AgentSearch, if you run it. It WRAPS SearXNG rather than replacing it
      # — it still needs the instance above to be up — and adds cross-engine
      # deduplication, scoring, content extraction and prompt-injection
      # scrubbing in front. Set it and /search uses it; leave it empty and the
      # direct SearXNG path is unchanged. Default port 3939.
      - AGENT_SEARCH_URL=${AGENT_SEARCH_URL:-}
      # Only if you started AgentSearch with AGENT_SEARCH_TOKEN set.
      - AGENT_SEARCH_TOKEN=${AGENT_SEARCH_TOKEN:-}
      # general | code | academic | news | private | reference | community.
      # Empty uses its plain /search.
      - AGENT_SEARCH_STRATEGY=${AGENT_SEARCH_STRATEGY:-}
      # Domains where clicking and typing are permitted. Empty means every
      # domain is refused, which is the correct default — reading a page is
      # one thing, acting on it is another.
      - BROWSER_ACT_ALLOWLIST=${BROWSER_ACT_ALLOWLIST:-}
      - BROWSER_DENYLIST=${BROWSER_DENYLIST:-}
      # LAN hosts exempt from the SSRF block (your printer's status page, say).
      - BROWSER_LAN_ALLOWLIST=${BROWSER_LAN_ALLOWLIST:-}
      - BROWSER_RESPECT_ROBOTS=${BROWSER_RESPECT_ROBOTS:-true}
      # Chromium's own sandbox needs unprivileged user namespaces in the
      # container. If it dies with "Operation not permitted", prefer granting
      # those over setting this to 1 — it removes a real layer.
      - BROWSER_CHROMIUM_NO_SANDBOX=${BROWSER_CHROMIUM_NO_SANDBOX:-0}
    # Chromium crashes on the default 64 MB /dev/shm as soon as a page is
    # non-trivial. This is the fix, not --disable-dev-shm-usage.
    shm_size: 512m
    tmpfs:
      - /tmp:size=512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; r=u.Request('http://127.0.0.1:8210/healthz', headers={'Authorization':'Bearer '+os.environ.get('JARVIS_BROWSER_TOKEN','')}); exit(0 if u.urlopen(r,timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- SearXNG: private metasearch (optional, profile: search) -------------
  # Opt-in because plenty of installations already run one:
  #
  #   docker compose --profile search up -d      # start it here
  #   docker compose up -d                       # don't — SEARXNG_URL points
  #                                              # at yours instead
  #
  # It is a metasearch engine, not an index: it asks DuckDuckGo, Brave, Mojeek
  # and friends on your behalf and merges the answers, so the upstream engines
  # see this container's IP and a bare query — no account, no cookie, no
  # history. It is the stack's only intended runtime egress (docs/security.md).
  #
  # First run needs a secret key. SearXNG refuses to start without one:
  #
  #   grep -q '^SEARXNG_SECRET=' .env 2>/dev/null || \
  #     echo "SEARXNG_SECRET=$(openssl rand -hex 32)" >> .env
  #
  # settings.yml enables the `json` format, which is OFF by default upstream
  # and REQUIRED for API use — without it every Jarvis search is a bare 403.
  # See searxng/README.md.
  # --- MQTT broker (optional) ----------------------------------------------
  # `configuration.yaml` points the mqtt integration at 127.0.0.1:1883, but
  # nothing in this stack used to listen there — Jarvis is an MQTT *client*, and
  # it retries forever with a warning if no broker answers. That is fine if you
  # already run one; this profile is for when you do not.
  #
  #     docker compose --profile mqtt up -d
  #
  # Loopback-only and anonymous, which are the same decision: see the header of
  # mosquitto/mosquitto.conf before widening either.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    profiles: [mqtt]
    network_mode: host
    environment:
      - TZ=${TZ:-Europe/London}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The entrypoint runs as root, chowns /mosquitto/data, then drops to the
    # `mosquitto` user. `cap_drop: [ALL]` alone takes away the three
    # capabilities it needs to do that, and the container crash-loops on
    #
    #     chown: /mosquitto/data: Operation not permitted
    #     Error setting groups whilst dropping privileges
    #
    # Exactly what searxng below needs, and for exactly the same reason. These
    # three are what it takes to STOP being root; they are not a way to stay
    # root, which `no-new-privileges` above forecloses anyway.
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      # Publishing to its own broker proves it is accepting connections, which
      # a port check does not.
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "jarvis/healthz", "-m", "ok", "-q", "0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    profiles: [search]
    network_mode: host
    environment:
      - TZ=${TZ:-Europe/London}
      # Overrides `server.secret_key` in settings.yml, which ships as the
      # upstream sentinel so that a missing secret fails loudly instead of
      # running on a key that is in every copy of this repository.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
      # Loopback by default. Host networking means this is what decides who
      # can reach SearXNG at all; widen it only if another machine needs it,
      # and then let ufw say which machine.
      - SEARXNG_BIND_ADDRESS=${SEARXNG_BIND_ADDRESS:-127.0.0.1}
      - SEARXNG_PORT=${SEARXNG_PORT:-8888}
      # Deliberately NOT derived from SEARXNG_URL: that variable says where
      # Jarvis looks for search, which is a different question from where this
      # instance thinks it lives, and the two differ the moment someone points
      # SEARXNG_URL at a box on the LAN while this profile is also up.
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://127.0.0.1:${SEARXNG_PORT:-8888}/}
      # Off for LAN use: the limiter defends a public instance from strangers,
      # and here all it can do is rate-limit you into 429s mid-conversation.
      # It also wants a Valkey/Redis container this stack does not run.
      - SEARXNG_LIMITER=false
    volumes:
      - ./searxng:/etc/searxng
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The image drops to its own unprivileged user, which needs these three
    # to do it. Nothing else.
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      # Follows SEARXNG_PORT rather than hardcoding 8888: an operator who
      # moves the port would otherwise get a container that works perfectly
      # and reports itself unhealthy for ever.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${SEARXNG_PORT:-8888}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- Ollama (usually already on the host) -------------------------------
  # Uncomment only if you are NOT running Ollama natively. Jarvis talks to
  # whatever answers on 11434 — see `llm: url:` in config/configuration.yaml.
  # GPU users need the NVIDIA container toolkit for the `deploy` block.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./ollama:/root/.ollama
  #   environment:
  #     - TZ=${TZ:-Europe/London}
  #     - OLLAMA_HOST=127.0.0.1:11434   # never 0.0.0.0 — Ollama has no auth
  #     - OLLAMA_KEEP_ALIVE=30m
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # --- Agent fan-out and the execution jail (optional) --------------------
  # The orchestrator does multi-agent delegation and OpenCode coding jobs; the
  # sandbox runs approval-gated commands with no network at all. Most
  # installations do not need either.
  #
  # RUN THEM FROM THE PARENT REPO, NOT FROM HERE:
  #
  #     cd .. && docker compose --profile agents up -d
  #
  # ../docker-compose.yml defines both, with the workspace-permissions init
  # job they need and the resource limits the sandbox needs, behind an
  # `agents` profile. Uncommenting the sketch below *as well* gives you two
  # definitions fighting over the container names `jarvis-orchestrator` and
  # `jarvis-sandbox`, one host port, and one bind mount — which is a failed
  # `up`, not a second copy.
  #
  # It is kept, commented, for the standalone case in ../docs/standalone.md:
  # jarvis-core extracted on its own, with no parent repo to run. Fill
  # ORCHESTRATOR_TOKEN and APPROVAL_SECRET in .env first, and vendor the two
  # build contexts next to this file. The sandbox's `network_mode: none` is a
  # security boundary, not a default — it runs LLM-proposed commands and must
  # never be given host or LAN networking.
  #
  # jarvis-orchestrator:
  #   build: ../jarvis-orchestrator
  #   container_name: jarvis-orchestrator
  #   restart: unless-stopped
  #   network_mode: host              # binds :8188; ufw allows this host only
  #   environment:
  #     - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
  #     - PLANNER_MODEL=${PLANNER_MODEL:-qwen3:8b}
  #     - CODER_MODEL=${CODER_MODEL:-qwen2.5-coder:7b}
  #     - WORKSPACE=/workspace
  #     - ORCHESTRATOR_TOKEN=${ORCHESTRATOR_TOKEN}
  #     - APPROVAL_SECRET=${APPROVAL_SECRET}
  #   volumes:
  #     - ../jarvis-workspace:/workspace
  #   read_only: true
