# Broker config for the optional `mqtt` compose profile.
#
# LOOPBACK ONLY, DELIBERATELY. The stack runs `network_mode: host`, so the
# address in `listener` is the whole access-control story — there is no docker
# network to hide behind and no `ports:` mapping to narrow it. Mosquitto's own
# default (0.0.0.0 with anonymous access) would put an unauthenticated broker
# on your LAN, and an MQTT broker is not a passive listener here: Jarvis has
# `discovery: true`, so anything that can publish to `homeassistant/#` can
# create entities in your house. That is a real, exercised attack surface —
# see the MQTT sections of docs/security.md.
listener 1883 127.0.0.1

# Anonymous is acceptable ONLY because of the line above: reaching this port
# already means being on the machine. If you change `listener` to 0.0.0.0 or a
# LAN address, you must turn this off and add a password file in the same
# commit:
#
#     allow_anonymous false
#     password_file /mosquitto/config/passwd
#
#     docker compose --profile mqtt exec mosquitto \
#         mosquitto_passwd -c /mosquitto/config/passwd jarvis
#
# then set username/password in configuration.yaml's `mqtt:` block, with the
# password as `!secret mqtt_password`.
allow_anonymous true

# Survive a restart, so retained discovery messages are not lost and every
# device does not have to re-announce itself.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
