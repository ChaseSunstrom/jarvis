# Jarvis companion services — the HUD, the orchestrator, and the sandbox.
#
# This is NOT the main stack. `jarvis-core/docker-compose.yml` is: it runs
# jarvis-core itself plus Wyoming STT/TTS/wake, photon and jarvis-browser.
# Start that first. This file adds the three things that live outside it:
#
#   jarvis-web           the browser HUD, on :8199              (always)
#   jarvis-orchestrator  multi-agent fan-out, coding jobs, the command broker
#   jarvis-sandbox       the network-less jail those commands actually run in
#
#   cd jarvis-core && docker compose up -d              # the assistant
#   cd ..           && docker compose up -d             # the HUD, on its own
#   cd ..           && docker compose --profile agents up -d   # ...and these
#
# The orchestrator and the sandbox sit behind the `agents` profile, the same
# opt-in searxng gets in jarvis-core's compose. "Optional" has to mean the
# thing does not start, and a plain `up -d` bringing up a command broker with
# `restart: unless-stopped` is not optional — it is on, on every boot, in
# every installation that ran the quick start. Both secrets have to be in
# `.env` before the profile does anything anyway: the orchestrator refuses to
# start without them.
#
# Security posture (see docs/security.md and jarvis-core/docs/security.md):
#   - jarvis-web:          host networking; binds :8199. LAN/WireGuard only (ufw).
#   - jarvis-orchestrator: host networking; binds :8188. Reachable from the
#                          jarvis-core host only; no LAN inbound (ufw).
#   - jarvis-sandbox:      network_mode: none, non-root, read-only rootfs,
#                          cap_drop ALL, no-new-privileges, tight limits.
#                          The ONLY crossover is ./jarvis-workspace. This stays
#                          isolated by design — it runs LLM-proposed commands,
#                          so it must NEVER get host/LAN networking.
#
# The orchestrator and sandbox are reached from jarvis-core through its
# `orchestrator:` config block, which needs ORCHESTRATOR_TOKEN and
# APPROVAL_SECRET set in .env. Those two must be DIFFERENT values: holding the
# API token must not be enough to execute a command.
#
# NOTE: web + orchestrator use host networking so their 127.0.0.1 defaults
# reach jarvis-core (8080) and Ollama (11434) on the host. Under host mode
# `ports:` is ignored — the app's own bind port (PORT/8199, uvicorn/8188) is
# what's exposed, and ufw is what limits who can reach it.

services:
  # One-shot: create the shared workspace queue dirs with perms both non-root
  # services (uid 10001 sandbox, 10002 orchestrator) can write. Bind mounts
  # keep host ownership, so a non-root container can't mkdir here on its own.
  # Reuses the sandbox image (no extra pull); runs as root only to fix perms,
  # then exits. network: none — it needs nothing but the volume.
  jarvis-init:
    # Built here, never published: without this compose tries a registry
    # pull first and prints a scary "access denied" warning before falling
    # back to building anyway.
    pull_policy: build
    build:
      context: ./jarvis-sandbox
    container_name: jarvis-init
    profiles: [agents]
    user: "0:0"
    network_mode: "none"
    # command MUST be a list (single literal-block element): a scalar string
    # would be word-split by Compose, leaving `sh -c mkdir` with the paths as
    # positional args -> "mkdir: missing operand" -> exit 1.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -ex
        mkdir -p /workspace/.exec/queue /workspace/.exec/results /workspace/.code_jobs
        chmod -R 0777 /workspace/.exec /workspace/.code_jobs
        ls -la /workspace
        echo "jarvis-init: workspace prepared"
    volumes:
      - ./jarvis-workspace:/workspace
    restart: "no"

  jarvis-web:
    # Built here, never published: without this compose tries a registry
    # pull first and prints a scary "access denied" warning before falling
    # back to building anyway.
    pull_policy: build
    build: ./jarvis-web
    container_name: jarvis-web
    restart: unless-stopped
    network_mode: "host"
    environment:
      # Points at jarvis-core. The HUD also supports JARVIS_BACKEND=ha with
      # HA_URL/HA_TOKEN if you still run Home Assistant alongside; see
      # jarvis-web/README.md.
      - JARVIS_URL=${JARVIS_URL:-http://127.0.0.1:8080}
      - JARVIS_TOKEN=${JARVIS_TOKEN}
      - PORT=8199
      - JARVIS_PIPELINE=${JARVIS_PIPELINE:-Jarvis}
      - JARVIS_TTS_VOICE=${JARVIS_TTS_VOICE:-en_GB-alan-medium}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8199/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  jarvis-orchestrator:
    # Built here, never published: without this compose tries a registry
    # pull first and prints a scary "access denied" warning before falling
    # back to building anyway.
    pull_policy: build
    build: ./jarvis-orchestrator
    container_name: jarvis-orchestrator
    profiles: [agents]
    restart: unless-stopped
    depends_on:
      jarvis-init:
        condition: service_completed_successfully
    network_mode: "host"           # binds :8188; ufw allows the core host only
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
      - PLANNER_MODEL=${PLANNER_MODEL:-qwen3:8b}
      - CODER_MODEL=${CODER_MODEL:-qwen2.5-coder:7b}
      - WORKSPACE=/workspace
      # Two secrets, deliberately distinct. The service refuses to start if
      # either is unset.
      - ORCHESTRATOR_TOKEN=${ORCHESTRATOR_TOKEN}
      - APPROVAL_SECRET=${APPROVAL_SECRET}
    volumes:
      - ./jarvis-workspace:/workspace   # shared with sandbox; NOT host root
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8188/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  jarvis-sandbox:
    # Built here, never published: without this compose tries a registry
    # pull first and prints a scary "access denied" warning before falling
    # back to building anyway.
    pull_policy: build
    build:
      context: ./jarvis-sandbox
      args:
        # busybox-only by default (no network at build). Set to 1 to add
        # bash/coreutils/git/jq: SANDBOX_EXTRA_TOOLS=1 docker compose build
        SANDBOX_EXTRA_TOOLS: ${SANDBOX_EXTRA_TOOLS:-0}
    container_name: jarvis-sandbox
    profiles: [agents]
    restart: unless-stopped
    depends_on:
      jarvis-init:
        condition: service_completed_successfully
    network_mode: "none"               # verified by tests/adversarial + scripts/egress-audit.sh
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    cpus: 2.0
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ./jarvis-workspace:/workspace   # the ONLY writable crossover
    # No config, no Docker socket, no host mounts, no secrets, no LAN.
