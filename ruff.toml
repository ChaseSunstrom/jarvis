# Lint configuration for every python tree in the repo.
#
# Deliberately narrow. This project's style is already consistent and heavily
# commented, and a linter that reformats it or argues about line length would
# produce a thousand-line diff that hides the eight real findings underneath.
# So the rules here are the ones that catch a DEFECT rather than a preference:
#
#   F   pyflakes      — undefined names, unused imports, unused locals,
#                       f-strings with no placeholders, duplicate arguments.
#                       Every one of these is dead or wrong code.
#   E9  syntax/IO     — a file that does not parse.
#   B   bugbear       — the subset below: mutable default arguments and
#                       loop-variable capture in a closure. Both are bugs that
#                       only show up under a second caller or a second
#                       iteration, which is to say in production.
#
# Everything else — line length, quote style, import order, docstring
# conventions, `raise ... from` — is left alone on purpose. Raise the bar
# deliberately, with a commit that fixes what it turns red, rather than by
# adding a rule that everybody then learns to ignore.

line-length = 100
target-version = "py311"

extend-exclude = [
    "node_modules",
    "build",
    ".svelte-kit",
    "jarvis-desktop/jarvis_desktop.egg-info",
]

[lint]
select = ["F", "E9", "B006", "B008", "B023"]

[lint.per-file-ignores]
# A test's fixtures and its assertions read better with names that a linter
# calls unused, and `import *` in a conftest is how pytest plugins are shared.
"**/tests/**" = ["F811", "F403", "F405"]
"**/conftest.py" = ["F401", "F403", "F405"]
# `Depends(...)`, `Body(...)` and `Query(...)` in a default argument is not the
# mutable-default bug B008 is looking for — it is how FastAPI declares a route's
# dependencies, and the framework evaluates them per request.
"jarvis-core/jarvis/api/rest.py" = ["B008"]
"jarvis-orchestrator/app/**" = ["B008"]
