# Package: privacy retention. Nightly purge of recorder history and assist
# traces. No raw audio is ever stored by the pipeline (HA keeps STT text and
# debug traces only); this bounds how long the text survives.

automation:
  - id: jarvis_nightly_purge
    alias: "Jarvis: nightly recorder purge"
    triggers:
      - trigger: time
        at: "03:30:00"
    actions:
      - action: recorder.purge
        data:
          keep_days: 7
          repack: "{{ now().isoweekday() == 7 }}"   # repack sundays
      # Drop assist/conversation trace entities faster than everything else.
      - action: recorder.purge_entities
        data:
          keep_days: 1
        target:
          entity_id:
            - sensor.jarvis_last_satellite
        # Add your assist_satellite / conversation entities here; debug
        # traces (Settings → Voice assistants → debug) are in-memory and
        # capped by HA itself.

  # Track which satellite/device spoke last (used for routing).
  - id: jarvis_track_last_satellite
    alias: "Jarvis: track last active satellite"
    mode: restart
    triggers:
      - trigger: state
        entity_id: assist_satellite.pixel_phone      # <<< list your satellites
        to: "listening"
    actions:
      - action: input_text.set_value
        target: { entity_id: input_text.jarvis_last_satellite }
        data: { value: "{{ trigger.entity_id }}" }

input_text:
  jarvis_last_satellite:
    name: Jarvis last satellite
    initial: unknown

template:
  - sensor:
      - name: "Jarvis Last Satellite"
        unique_id: jarvis_last_satellite
        state: "{{ states('input_text.jarvis_last_satellite') }}"
