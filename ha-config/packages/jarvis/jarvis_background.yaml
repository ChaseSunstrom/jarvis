# Package: Tier-2 parallelism — run_background_task.
# The conversation returns immediately ("I'll see to it, Sir"); an automation
# picks the job up OUTSIDE the conversation turn, runs it through
# conversation.process against the Jarvis agent, and reports the result via
# the routing policy (script.jarvis_report). A small queue keyed by a
# generated task id + the originating conversation_id lets many coexist.

script:
  jarvis_run_background_task:
    alias: "Jarvis: run background task"
    description: >
      Queue a task to run in the background, outside this conversation.
      Returns immediately with a task id. Use for anything long-running the
      user should not wait on. The result is delivered later via the
      response-routing policy.
    fields:
      description:
        description: "Plain-language description of the task to perform"
        required: true
      notify_when_done:
        description: "Whether to report the result when finished (default true)"
        required: false
    sequence:
      - variables:
          task_id: "bg-{{ now().strftime('%Y%m%d%H%M%S') }}-{{ range(1000,9999) | random }}"
      - event: jarvis_background_task
        event_data:
          task_id: "{{ task_id }}"
          description: "{{ description }}"
          notify_when_done: "{{ notify_when_done | default(true) }}"
          conversation_id: "{{ conversation_id | default('') }}"
      - variables:
          resp:
            task_id: "{{ task_id }}"
            status: queued
      - stop: "queued"
        response_variable: resp

automation:
  - id: jarvis_background_dispatcher
    alias: "Jarvis: background task dispatcher"
    mode: parallel
    max: 10
    triggers:
      - trigger: event
        event_type: jarvis_background_task
    actions:
      - action: conversation.process
        data:
          agent_id: conversation.jarvis          # <<< your Ollama conversation agent
          text: >-
            Background task (id {{ trigger.event.data.task_id }}):
            {{ trigger.event.data.description }}
        response_variable: result
      - if: "{{ trigger.event.data.notify_when_done }}"
        then:
          - action: script.jarvis_report
            data:
              kind: task_done
              message: >-
                {{ result.response.speech.plain.speech
                   | default('Task ' ~ trigger.event.data.task_id ~ ' finished.', true) }}
