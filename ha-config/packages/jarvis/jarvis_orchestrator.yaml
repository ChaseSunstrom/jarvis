# Package: Tier-3 orchestration tools — delegate_to_agents, code_task,
# execute_command — and the human-approval gate.
#
# SECURITY MODEL (do not weaken):
#   * orchestrator_token authenticates HA→orchestrator API calls.
#   * approval_secret is ONLY sent by the approve/deny rest_commands below,
#     which only run AFTER a human taps Approve on an actionable
#     notification. The LLM cannot fire mobile_app_notification_action
#     events (event firing is not an exposed tool) and never sees either
#     secret (script-scope variables are not returned to the model).
#   * The orchestrator refuses to execute anything whose request_id has not
#     been approved with the correct approval secret; the sandbox only runs
#     what the orchestrator enqueues. Persona/prompt content cannot reach
#     any of this — the gate is plain YAML + HTTP, outside the model.
#
# Secrets required (secrets.yaml):
#   orchestrator_url: "http://127.0.0.1:8188"   # not templatable in rest_command URL — hardcode below
#   orchestrator_bearer: "Bearer <ORCHESTRATOR_TOKEN>"
#   approval_secret: "<APPROVAL_SECRET>"

rest_command:
  jarvis_orch_delegate:
    url: "http://127.0.0.1:8188/delegate"
    method: post
    timeout: 300
    headers:
      Authorization: !secret orchestrator_bearer
    content_type: application/json
    payload: '{"tasks": {{ tasks | to_json }} }'

  jarvis_orch_code_task:
    url: "http://127.0.0.1:8188/code_task"
    method: post
    timeout: 30
    headers:
      Authorization: !secret orchestrator_bearer
    content_type: application/json
    payload: '{"repo": {{ repo | to_json }}, "instruction": {{ instruction | to_json }} }'

  jarvis_orch_code_status:
    url: "http://127.0.0.1:8188/code_task/{{ job_id }}"
    method: get
    timeout: 30
    headers:
      Authorization: !secret orchestrator_bearer

  jarvis_orch_code_apply:
    url: "http://127.0.0.1:8188/code_task/{{ job_id }}/apply"
    method: post
    timeout: 300
    headers:
      Authorization: !secret orchestrator_bearer
      X-Approval-Secret: !secret approval_secret
    content_type: application/json
    payload: '{"mode": {{ mode | default("commit") | to_json }} }'

  jarvis_orch_exec_request:
    url: "http://127.0.0.1:8188/execute/request"
    method: post
    timeout: 30
    headers:
      Authorization: !secret orchestrator_bearer
    content_type: application/json
    payload: '{"command": {{ command | to_json }}, "why": {{ why | to_json }} }'

  jarvis_orch_exec_approve:
    url: "http://127.0.0.1:8188/execute/approve"
    method: post
    timeout: 180
    headers:
      Authorization: !secret orchestrator_bearer
      X-Approval-Secret: !secret approval_secret
    content_type: application/json
    payload: '{"request_id": {{ request_id | to_json }} }'

  jarvis_orch_exec_deny:
    url: "http://127.0.0.1:8188/execute/deny"
    method: post
    timeout: 30
    headers:
      Authorization: !secret orchestrator_bearer
      X-Approval-Secret: !secret approval_secret
    content_type: application/json
    payload: '{"request_id": {{ request_id | to_json }} }'

script:
  # ---------------------------------------------------------------- Tier 3
  jarvis_execute_command:
    alias: "Jarvis: execute command (sandboxed, approval-gated)"
    description: >
      Run a shell command in the isolated sandbox (no network, no host
      access). A human MUST approve the exact command on their phone first;
      nothing runs before approval. Returns stdout/stderr/exit code, or a
      denial notice. Provide 'why' honestly — the user sees it.
    mode: queued
    max: 3
    fields:
      command: { description: "the exact shell command", required: true }
      why: { description: "one line: why this command is needed", required: true }
    sequence:
      - action: rest_command.jarvis_orch_exec_request
        data:
          command: "{{ command }}"
          why: "{{ why }}"
        response_variable: req
      - variables:
          request_id: "{{ req.content.request_id }}"
      # Show the TRUE command (from the orchestrator's stored copy, not the
      # model's paraphrase) and wait for a human decision.
      - action: notify.mobile_app_pixel                     # <<< your notify svc
        data:
          title: "Jarvis wants to run a command"
          message: "{{ req.content.command }}\n\nReason: {{ why }}"
          data:
            sticky: true
            tag: "jarvis-exec-{{ request_id }}"
            actions:
              - action: "JARVIS_EXEC_APPROVE_{{ request_id }}"
                title: "Approve"
              - action: "JARVIS_EXEC_DENY_{{ request_id }}"
                title: "Deny"
      - wait_for_trigger:
          - trigger: event
            event_type: mobile_app_notification_action
            event_data:
              action: "JARVIS_EXEC_APPROVE_{{ request_id }}"
          - trigger: event
            event_type: mobile_app_notification_action
            event_data:
              action: "JARVIS_EXEC_DENY_{{ request_id }}"
        timeout: "00:02:00"
        continue_on_timeout: true
      - if: >-
          {{ wait.trigger is not none and
             wait.trigger.event.data.action.startswith('JARVIS_EXEC_APPROVE') }}
        then:
          - action: rest_command.jarvis_orch_exec_approve
            data: { request_id: "{{ request_id }}" }
            response_variable: result
          - variables:
              resp:
                status: "{{ result.content.status }}"
                exit_code: "{{ result.content.exit_code | default(-1) }}"
                stdout: "{{ result.content.stdout | default('') }}"
                stderr: "{{ result.content.stderr | default('') }}"
          - stop: "executed"
            response_variable: resp
        else:
          - action: rest_command.jarvis_orch_exec_deny
            data: { request_id: "{{ request_id }}" }
          - variables:
              resp:
                status: denied
                detail: "The user declined (or did not answer). Nothing was executed."
          - stop: "denied"
            response_variable: resp

  # ------------------------------------------------- generic Tier-3 gate
  # Used by generator-emitted tier-3 tools. Returns {approved: bool}.
  jarvis_request_approval:
    alias: "Jarvis: request human approval"
    description: "Internal approval gate — do not call directly."
    mode: queued
    max: 3
    fields:
      summary: { description: "what is being approved", required: true }
    sequence:
      - variables:
          gate_id: "gate-{{ now().strftime('%H%M%S') }}-{{ range(1000,9999) | random }}"
      - action: notify.mobile_app_pixel                     # <<< your notify svc
        data:
          title: "Jarvis needs approval"
          message: "{{ summary }}"
          data:
            sticky: true
            tag: "jarvis-{{ gate_id }}"
            actions:
              - action: "JARVIS_GATE_APPROVE_{{ gate_id }}"
                title: "Approve"
              - action: "JARVIS_GATE_DENY_{{ gate_id }}"
                title: "Deny"
      - wait_for_trigger:
          - trigger: event
            event_type: mobile_app_notification_action
            event_data:
              action: "JARVIS_GATE_APPROVE_{{ gate_id }}"
          - trigger: event
            event_type: mobile_app_notification_action
            event_data:
              action: "JARVIS_GATE_DENY_{{ gate_id }}"
        timeout: "00:02:00"
        continue_on_timeout: true
      - variables:
          resp:
            approved: >-
              {{ wait.trigger is not none and
                 wait.trigger.event.data.action.startswith('JARVIS_GATE_APPROVE') }}
      - stop: "gate done"
        response_variable: resp

  # ---------------------------------------------------------------- Tier 3
  jarvis_delegate_to_agents:
    alias: "Jarvis: delegate to agent team"
    description: >
      Fan a multi-part job out to a team of specialist agents and get a
      synthesized result. Give one scoped task per list item. Use only for
      genuinely multi-part work; simple requests are faster done directly.
    fields:
      tasks:
        description: "list of scoped task strings"
        required: true
        selector: { object: null }
    sequence:
      - action: rest_command.jarvis_orch_delegate
        data: { tasks: "{{ tasks }}" }
        response_variable: result
      - variables:
          resp:
            status: "{{ result.content.status | default('error') }}"
            synthesis: "{{ result.content.synthesis | default('') }}"
            agents: "{{ result.content.agents | default([]) }}"
      - stop: "delegated"
        response_variable: resp

  jarvis_code_task:
    alias: "Jarvis: agentic coding task"
    description: >
      Ask the coding agent (OpenCode on the local coder model) to write code
      for a repo in the sandbox workspace. Returns a job id immediately; the
      result is a DIFF only — it is never run or committed without separate
      human approval (jarvis_apply_code). Report the job id to the user.
    fields:
      repo: { description: "workspace-relative repo dir, e.g. 'myproject'", required: true }
      instruction: { description: "what to build/change", required: true }
    sequence:
      - action: rest_command.jarvis_orch_code_task
        data:
          repo: "{{ repo }}"
          instruction: "{{ instruction }}"
        response_variable: result
      - variables:
          resp:
            job_id: "{{ result.content.job_id | default('') }}"
            status: "{{ result.content.status | default('error') }}"
      - stop: "code task queued"
        response_variable: resp

  jarvis_code_task_status:
    alias: "Jarvis: coding task status"
    description: "Check a code_task job: status, summary and diff stats."
    fields:
      job_id: { description: "job id from jarvis_code_task", required: true }
    sequence:
      - action: rest_command.jarvis_orch_code_status
        data: { job_id: "{{ job_id }}" }
        response_variable: result
      - stop: "status"
        response_variable: result

  jarvis_apply_code:
    alias: "Jarvis: apply coding result (approval-gated)"
    description: >
      Commit (or run) the diff produced by a finished code_task. Requires
      human approval; nothing is applied before the user taps Approve.
    fields:
      job_id: { description: "finished code_task job id", required: true }
      mode: { description: "'commit' or 'run'", required: false }
    sequence:
      - action: rest_command.jarvis_orch_code_status
        data: { job_id: "{{ job_id }}" }
        response_variable: st
      - action: script.jarvis_request_approval
        data:
          summary: >-
            Apply code job {{ job_id }} ({{ mode | default('commit') }}):
            {{ st.content.summary | default('no summary') }} —
            {{ st.content.diff_stat | default('') }}
        response_variable: gate
      - if: "{{ not gate.approved }}"
        then:
          - variables:
              resp: { status: denied, detail: "Not applied." }
          - stop: "denied"
            response_variable: resp
      - action: rest_command.jarvis_orch_code_apply
        data:
          job_id: "{{ job_id }}"
          mode: "{{ mode | default('commit') }}"
        response_variable: result
      - stop: "applied"
        response_variable: result

automation:
  # Orchestrator calls webhook when an async code job finishes.
  - id: jarvis_code_task_done
    alias: "Jarvis: code task finished"
    triggers:
      - trigger: webhook
        webhook_id: jarvis_code_done          # local_only stays true by default
        allowed_methods: [POST]
        local_only: true
    actions:
      - action: script.jarvis_report
        data:
          kind: task_done
          message: >-
            Coding job {{ trigger.json.job_id }} finished:
            {{ trigger.json.summary | default('see diff') }}.
            Say "apply code job {{ trigger.json.job_id }}" to review and commit.
