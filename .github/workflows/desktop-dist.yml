name: Build jarvis-desktop

# The desktop agent's counterpart to android-apk.yml.
#
# There is no app bundle to build: jarvis-desktop is a plain Python package with
# a `jarvis-desktop` console script, and freezing it (PyInstaller and friends)
# would fight the optional-dependency design — pyautogui, psutil, pyperclip and
# tkinter are all meant to be absent, with the agent degrading rather than
# failing. So the artifact is a wheel and an sdist.
#
# What this catches that `ci.yml` does not. The python matrix job installs the
# package with `pip install -e . || pip install .`, and that `||` is the
# problem: an editable install that fails for any reason silently falls back,
# so a broken `[project]` table, a package missing from `packages.find`, or a
# dead entry point never turns a job red. Nor does an editable install prove
# the *built* artifact works — it runs from the source tree either way.
#
# So this builds the real distributions, checks their metadata, installs the
# WHEEL into a clean venv on all three target platforms, and runs the console
# script. That is the first thing in this repo that proves a user who types
# `pip install jarvis_desktop-*.whl` gets a working `jarvis-desktop` command.

# Triggers match ci.yml — see that file's header for why `push` and
# `pull_request` are scoped to the integration branches rather than overlapping.
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths: &paths
      - "jarvis-desktop/**"
      - ".github/workflows/desktop-dist.yml"
  pull_request:
    branches: [main, dev]
    paths: *paths
  release:
    types: [published]

concurrency:
  group: desktop-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build
        working-directory: jarvis-desktop
        run: python -m build

      - name: Check the metadata
        working-directory: jarvis-desktop
        run: python -m twine check dist/*

      - name: Summarise
        working-directory: jarvis-desktop
        run: |
          set -eu
          {
            echo '### jarvis-desktop distributions'
            echo ''
            echo '| file | size |'
            echo '|---|---:|'
            for f in dist/*; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-dist
          path: jarvis-desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  install:
    name: install the wheel · ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the package claims to support. Windows and macOS
        # are where a path assumption or a platform-only import would show up,
        # and nothing else in CI runs on either.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: jarvis-desktop-dist
          path: dist

      # A clean venv, and the wheel by filename — no source tree in sight, so a
      # module that only imports because the repo happens to be the working
      # directory fails here.
      - name: Install the wheel and run the console script
        shell: bash
        run: |
          set -eu
          python -m venv .venv
          if [ -d .venv/bin ]; then VENV_BIN=.venv/bin; else VENV_BIN=.venv/Scripts; fi
          "$VENV_BIN/python" -m pip install --upgrade pip
          wheel=$(ls dist/*.whl)
          "$VENV_BIN/python" -m pip install "$wheel"

          # The entry point pyproject declares. `--version` is argparse's own
          # action, so this exercises import of the whole module graph and then
          # exits 0 without touching a socket, a config file or a microphone.
          "$VENV_BIN/jarvis-desktop" --version
          "$VENV_BIN/jarvis-desktop" --help > /dev/null

          # And importable under its distribution name, not just runnable.
          "$VENV_BIN/python" -c "import jarvis_desktop; print(jarvis_desktop.__name__, 'ok')"

  # --- the shell -------------------------------------------------------------
  #
  # The Electron app that shows the console (M07). Built and driven for real on
  # a runner with no display: `tools/xvfb.sh` starts Xvfb itself rather than
  # using `xvfb-run`, and `tools/electron-runtime.sh` unpacks Electron's
  # library closure under $HOME — both needed on a machine where nothing may be
  # installed system-wide, which is the constraint this project develops under.
  shell:
    name: desktop shell (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: jarvis-desktop-app
        run: npm ci || npm install --no-audit --no-fund

      - name: Build
        working-directory: jarvis-desktop-app
        run: npm run build

      - name: Unit tests (Electron mocked out entirely)
        working-directory: jarvis-desktop-app
        run: npx vitest run

      - name: Electron under Xvfb
        working-directory: jarvis-desktop-app
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnotify4 libnss3 libxss1 \
            libxtst6 libatk-bridge2.0-0 libgbm1 libasound2t64 || true
          # Ubuntu 24.04 runners restrict unprivileged user namespaces; the
          # spec passes --no-sandbox under CI, and this lifts the restriction
          # too, so the two ways Electron can fail to start both go away.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bash tools/xvfb.sh npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-shell-playwright-report
          path: jarvis-desktop-app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Unpacked distribution
        working-directory: jarvis-desktop-app
        run: npm run dist:dir

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-app-linux
          path: jarvis-desktop-app/dist-app/linux-unpacked
          if-no-files-found: error
