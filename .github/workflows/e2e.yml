name: End-to-end

# Layer 3 and layer 4 of docs/testing.md: the REAL jarvis-core, booted against
# fake model and voice backends, driven by REAL clients.
#
#   * harness  — the server itself, proved by testing/e2e (fast, ~1 minute)
#   * android  — the real APK on a real emulator (slow, tens of minutes)
#   * desktop  — the real `python -m jarvis_desktop` over the device channel
#
# Deliberately NOT part of ci.yml: the emulator job takes tens of minutes and
# must never be what a push waits on for feedback. ci.yml stays the fast lane.
#
# NOTE on YAML hygiene: exactly ONE key of each name per mapping. A duplicate is
# legal YAML (last wins) but makes GitHub reject the whole workflow — it then
# runs zero jobs and names the run after the file, which looks like a mysterious
# failure. ci.yml's "static checks" job fails the build on duplicates; keep it
# that way.

# Only for the things this workflow can actually break — half an hour of runner
# time per change is worth spending narrowly.
#
# `jarvis-core/**` is in the list even though it makes a server change pay for
# an emulator run: catching a server change that breaks a real client is the
# entire reason this workflow exists. `run_emulator: false` on a manual dispatch
# is the escape hatch when you only want the fast two.
# Triggers match ci.yml: `push` for the integration branches, `pull_request`
# for what is on its way to them, and no overlap between the two. See that
# file's header for why.
on:
  push:
    branches: [main, dev]
    paths: &paths
      - "android-app/**"
      - "testing/**"
      - "jarvis-core/**"
      - "jarvis-desktop/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main, dev]
    paths: *paths
  workflow_dispatch:
    inputs:
      run_emulator:
        description: "Also boot the Android emulator (adds ~30 minutes)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place to change the emulator target. `google_apis`, never
  # `google_apis_playstore`: this app ships with no Google Play Services and a
  # Play image is both slower and unrootable (which is how the screenshots come
  # off the device when the shell user cannot read them).
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  # One fixed screen geometry, so the screenshots this job exists to produce are
  # comparable from run to run. Both emulator steps and the AVD cache key read
  # this: a snapshot created for one profile must never be reused for another.
  EMULATOR_PROFILE: pixel_2

jobs:
  # ---------------------------------------------------------------------------
  # 1. The harness proves itself: a real server, on a real socket, with the two
  #    GPU-bound backends replaced at the wire protocol.
  # ---------------------------------------------------------------------------
  harness:
    name: e2e · harness self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # The harness boots the real jarvis-core as a subprocess, so the
          # server's own runtime dependencies must be present too.
          python -m pip install -r jarvis-core/requirements.txt
          python -m pip install -r testing/requirements.txt

      - name: End-to-end (testing/e2e)
        run: testing/scripts/run-e2e.sh

      # always(), not failure(): the generated config, the three process logs
      # and the WAVs the fake STT received are the baseline a future failure is
      # compared against.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-harness-artifacts
          path: testing/artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          set -u
          {
            echo '### e2e · harness self-test'
            echo ''
            echo 'Booted the REAL `jarvis-core` (`python -m jarvis`) against the fake'
            echo 'Ollama and the fake Wyoming stt/tts/wake stack, then ran'
            echo '`testing/e2e` against it over a real socket.'
            echo ''
            echo 'Artifact **e2e-harness-artifacts**: the generated'
            echo '`configuration.yaml`, `logs/jarvis-core.log`, both fake logs, and'
            echo 'every `audio/stt-*.wav` the fake STT was actually sent.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. The real APK, on a real emulator, against the real harness.
  # ---------------------------------------------------------------------------
  android:
    name: e2e · android emulator (API ${{ matrix.api-level }})
    # Skipped only when a human dispatches the workflow and unticks the box.
    # `inputs` is empty on a push, so the first clause carries that case.
    if: github.event_name != 'workflow_dispatch' || inputs.run_emulator
    runs-on: ubuntu-latest
    # An emulator boot plus a full instrumented suite. Generous on purpose: a
    # job that is killed at the wrong moment tells you nothing at all.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # minSdk is 29. API 30 is the oldest image with a modern, reliably
        # bootable x86_64 build, and exercises scoped storage — which is what
        # the screenshot directory lives under.
        api-level: [30]
    steps:
      - uses: actions/checkout@v4

      # Without this the emulator falls back to software virtualisation and
      # takes so long to boot that the job times out.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # This job needs more of the runner's disk than the runner has spare, and
      # only found out once the AVD cache started hitting. Run 31310950948 was a
      # cache MISS: it created the AVD in-place, so `system-images;android-30`
      # was already unpacked by the time the suite ran, and it passed. Run
      # 31324326040 was the first ever cache HIT — it restored a 1.19 GB AVD
      # archive AND then had to install the system image from scratch, and the
      # emulator step died inside sdkmanager with
      #
      #   You are running out of disk space. Free space left: 0 MB
      #   An error occurred while preparing SDK package Google APIs Intel
      #   x86_64 Atom System Image: No space left on device.
      #
      # before a single instrumented test started. That is not a flake that a
      # re-run clears: every run from here on hits the cache, so every run needs
      # this headroom. Nothing removed below is used by this build — android-app
      # is all Kotlin, with no externalNativeBuild, no CMakeLists.txt and no
      # jniLibs, so the SDK's bundled NDK (the largest single item) is dead
      # weight. Runs before the toolchain steps so the reclaim cannot race them.
      #
      # `df -h /` on both sides on purpose: this failure cost an hour to
      # diagnose precisely because no step ever recorded the free space.
      - name: Reclaim disk before the emulator
        run: |
          set -uo pipefail
          echo '----- free space before -----'
          df -h /
          sudo rm -rf \
            /usr/local/lib/android/sdk/ndk \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL || true
          docker image prune --all --force >/dev/null 2>&1 || true
          echo '----- free space after -----'
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Same reasoning as android-apk.yml: the repo ships
          # gradle-wrapper.properties but not the wrapper JAR, so the action
          # provides Gradle and we call `gradle` directly rather than ./gradlew.
          gradle-version: "8.10"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install harness dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r jarvis-core/requirements.txt
          python -m pip install -r testing/requirements.txt

      # The harness runs on the RUNNER, not in the emulator, and stays up for
      # the whole instrumented suite. `--wait` keeps it alive; nohup + a log
      # file keeps it alive across steps.
      - name: Start the jarvis-core harness
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/testing/artifacts"
          nohup python3 testing/harness/harness.py \
            --wait --keep \
            --host 0.0.0.0 \
            --work-dir "$GITHUB_WORKSPACE/testing/artifacts/harness" \
            --json-out "$GITHUB_WORKSPACE/testing/artifacts/harness.json" \
            > "$GITHUB_WORKSPACE/testing/artifacts/harness-stdout.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/testing/artifacts/harness.pid"

          # Wait for the description file rather than sleeping. harness.py only
          # writes it after /healthz answered, so this is already a readiness
          # signal; the explicit /healthz poll below is the belt to its braces.
          json="$GITHUB_WORKSPACE/testing/artifacts/harness.json"
          pid="$(cat "$GITHUB_WORKSPACE/testing/artifacts/harness.pid")"
          for _ in $(seq 1 180); do
            [ -s "$json" ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::the harness exited before it was ready"
              cat "$GITHUB_WORKSPACE/testing/artifacts/harness-stdout.log" || true
              exit 1
            fi
            sleep 1
          done
          if [ ! -s "$json" ]; then
            echo "::error::the harness never wrote $json"
            cat "$GITHUB_WORKSPACE/testing/artifacts/harness-stdout.log" || true
            exit 1
          fi

          PORT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ports"]["core"])' "$json")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$json")"

          ok=0
          for _ in $(seq 1 120); do
            code="$(curl -sS -o /tmp/healthz.json -w '%{http_code}' \
              "http://127.0.0.1:${PORT}/healthz" || echo 000)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::/healthz never answered 200 on port ${PORT}"
            tail -n 100 "$GITHUB_WORKSPACE/testing/artifacts/harness/logs/jarvis-core.log" || true
            exit 1
          fi
          echo "harness healthy on port ${PORT}: $(cat /tmp/healthz.json)"

          # The token is jarvis-core's documented JARVIS_TOKEN override for a
          # throwaway server. It is deterministic and not a secret.
          {
            echo "JARVIS_HARNESS_PORT=${PORT}"
            echo "JARVIS_HARNESS_TOKEN=${TOKEN}"
            echo "JARVIS_HARNESS_URL=http://127.0.0.1:${PORT}"
          } >> "$GITHUB_ENV"

      # Creating the AVD from scratch is several minutes every run, so it is
      # cached. What is NOT cached is a boot snapshot: the emulator step cold
      # boots on purpose (see `-no-snapshot-load` below for the crash that
      # bought), so a snapshot would be a gigabyte of restore time and disk —
      # on a job that has already run the runner out of space once — in
      # exchange for nothing.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # v2: v1 caches hold a `default_boot` snapshot from when this job
          # restored one. Nothing loads it now, so a v1 entry would be a
          # gigabyte restored on every run for no reason.
          key: avd-${{ matrix.api-level }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}-v2

      - name: Create the AVD for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          # `-no-snapshot-save`: this step exists to create the AVD, which is
          # what the cache holds and what is slow to rebuild. The snapshot it
          # used to write is deliberately not wanted — see the emulator step.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 1200
          disable-animations: false
          script: echo "AVD created for API ${{ matrix.api-level }}."

      - name: Instrumented suite on the emulator
        id: emulator
        env:
          # The script is a file now, so it cannot read `${{ }}` — the matrix
          # value has to arrive as an environment variable. android-emulator-
          # runner passes `process.env` straight through to the shell it spawns.
          API_LEVEL: ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          # `-no-snapshot-load` is doing real work here; do not "optimise" it
          # away. Restoring the cached snapshot made this job fail on EVERY run
          # once the AVD cache started hitting, with the emulator action's own
          # boot sequence dying before `script` ever ran:
          #
          #   Successfully loaded snapshot 'default_boot' using 6438 ms
          #   adb ... shell getprop sys.boot_completed -> 1
          #   Emulator booted.
          #   adb ... shell input keyevent 82
          #   java.lang.RuntimeException: android.os.DeadSystemException
          #
          # `sys.boot_completed` is part of the state the snapshot restores, so
          # it reads `1` the instant the snapshot loads and says nothing about
          # whether THIS boot's system_server is alive. The action's readiness
          # gate is therefore vacuous on a restore, and the unlock keyevent it
          # sends immediately afterwards lands on a system that is still coming
          # back up. That unlock is inside the action, before `script`, so it
          # cannot be worked around from our side — the only lever we have is
          # to refuse the snapshot and make the gate meaningful again.
          #
          # A cold boot costs about a minute. The AVD cache still earns its
          # keep: it skips `avdmanager create` and the system-image unpack,
          # which are the expensive parts.
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 1200
          disable-animations: true
          working-directory: android-app
          # ############ ONE LINE. THIS IS NOT A SHELL BLOCK. ############
          # android-emulator-runner does NOT hand this input to a shell as one
          # program. src/script-parser.ts splits it on /\r\n|\n|\r/, trims each
          # piece and drops blanks and #-comments; src/main.ts then runs the
          # pieces one at a time with `exec.exec('sh', ['-c', piece])`.
          #
          # So every line would get its own shell: an assignment is lost by the
          # next line, a `set` applies to nothing after it, a backslash
          # continuation is severed, and a multi-line `if ... fi` becomes
          # fragments that are each a syntax error alone. The first failure
          # makes exec.exec throw and the step dies with nothing run — which is
          # what happened on run 31303989376, where the echoed command was the
          # single line `set -uo pipefail` and dash rejected it.
          #
          # Keep this ONE line invoking ONE file. The file is bash and may use
          # bash. `testing/e2e/test_ci_workflow_contract.py` fails the build if
          # this input ever grows a second line, and checks that the file it
          # names exists and parses.
          #
          # `bash <path>`, not `./<path>`: a checkout that lost the executable
          # bit must not turn into a mystery permission error at minute forty.
          script: bash "$GITHUB_WORKSPACE/android-app/tools/run-instrumented-e2e.sh"

      # BEFORE the uploads, not after. The harness writes jarvis-core.log
      # continuously, and `testing/artifacts/**` is one of the things uploaded
      # below — a log still being appended to while it is being zipped is a
      # truncated log in the artifact, which is the one file a failure is read
      # from. Stopping first also means the artifact contains the server's
      # shutdown, so "did it die, or was it killed" is answerable.
      - name: Stop the harness
        if: always()
        run: |
          set -u
          pidfile="$GITHUB_WORKSPACE/testing/artifacts/harness.pid"
          [ -f "$pidfile" ] || exit 0
          pid="$(cat "$pidfile")"
          kill "$pid" 2>/dev/null || exit 0
          # harness.py traps SIGTERM and kills jarvis-core and both fakes by
          # process group on the way out; give it that chance before the runner
          # tears the whole VM down, or the logs stop mid-line.
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -0 "$pid" 2>/dev/null && kill -9 "$pid" 2>/dev/null
          exit 0

      - name: Harness log tail (on failure)
        if: failure()
        run: |
          set -u
          for log in "$GITHUB_WORKSPACE"/testing/artifacts/harness/logs/*.log; do
            [ -f "$log" ] || continue
            echo "----- $log (last 80 lines) -----"
            tail -n 80 "$log"
          done
          echo "----- crash buffer -----"
          tail -n 200 "$GITHUB_WORKSPACE/android-app/artifacts/logcat-crash.txt" 2>/dev/null || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-screenshots-api${{ matrix.api-level }}
          path: android-app/artifacts/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-reports-api${{ matrix.api-level }}
          path: |
            android-app/app/build/reports/androidTests/**
            android-app/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logcat and harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-logs-api${{ matrix.api-level }}
          # gradle-connected.log is gradle's own output, which is where the
          # failing test names and their exceptions live, and failing-tests.txt
          # is just those lines. Both are in the job log too — buried in 2800
          # lines of Gradle stack frames — and as files they are greppable.
          #
          # No `#` comments inside `path:`: it is a newline-separated glob list,
          # and a commented line is a pattern that matches nothing rather than a
          # comment.
          path: |
            android-app/artifacts/logcat.txt
            android-app/artifacts/logcat-crash.txt
            android-app/artifacts/dumpsys-package.txt
            android-app/artifacts/gradle-connected.log
            android-app/artifacts/failing-tests.txt
            android-app/artifacts/failure-digest.txt
            testing/artifacts/**
          if-no-files-found: warn
          retention-days: 14

      # THE LAST THING IN THE JOB LOG, on purpose.
      #
      # The emulator step already prints this, ~350 lines before the end —
      # behind three artifact uploads, each of which dumps thirty lines of
      # environment, and an eighty-line harness tail. That is far enough down
      # that reading "the tail of the log" misses it every time, which is not a
      # theoretical complaint: it cost three separate fetches to find one
      # stack trace while diagnosing CompanionAskTest.
      #
      # So the digest is repeated here, where `tail` finds it first. It is the
      # same file the emulator step wrote, not a second implementation that
      # could drift from it.
      - name: The failure, last (so a log tail finds it)
        if: failure()
        run: |
          set -u
          digest="$GITHUB_WORKSPACE/android-app/artifacts/failure-digest.txt"
          if [ -s "$digest" ]; then
            cat "$digest"
          else
            echo "No failure digest was written. The suite failed before it could"
            echo "run — a build error, or an emulator that never booted. The"
            echo "::error:: annotation above says which."
          fi

      # The emulator step writes the real summary itself, because only it knows
      # how many screenshots came off the device — and it drops a marker file
      # when it does. Anything that stops the script reaching that point leaves
      # no marker: a harness boot that failed (step skipped), an emulator that
      # never booted (step failed inside the action, before `script` ran), a
      # cancelled run. Keying off `outcome == 'skipped'` covered only the first
      # of those and left an emulator boot failure with no summary at all,
      # which is exactly when a human most needs to be told where to look.
      - name: Summary (no summary from the emulator)
        if: always()
        run: |
          set -u
          [ -f "$GITHUB_WORKSPACE/android-app/artifacts/summary-written" ] && exit 0
          {
            echo '### e2e · android emulator (API ${{ matrix.api-level }})'
            echo ''
            echo 'The instrumented suite produced no result: it either never'
            echo 'started (a step before it failed) or the emulator did not boot.'
            echo 'Step outcome was `${{ steps.emulator.outcome }}`.'
            echo ''
            echo 'Look at the job log for the `::error::` annotation, and at the'
            echo 'jarvis-core harness logs in artifact'
            echo '**android-e2e-logs-api${{ matrix.api-level }}**.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. The real desktop agent over the real device channel.
  # ---------------------------------------------------------------------------
  desktop:
    name: e2e · desktop agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r jarvis-core/requirements.txt
          python -m pip install -r testing/requirements.txt
          # The suite drives the REAL agent, so it has to be importable and
          # runnable as `python -m jarvis_desktop`.
          python -m pip install -e "./jarvis-desktop[dev]"

      # Unlike the emulator, this suite owns its server: conftest.py boots a
      # Harness per session and hands the agent a TCP proxy in front of it, so
      # a test can cut a live connection. Starting a second, long-lived one here
      # would compete for nothing. What this step is for is proving the harness
      # can boot on THIS runner — and failing in eight seconds with the server's
      # own log if it cannot, rather than inside a fixture twenty minutes later.
      - name: Prove the harness boots on this runner
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/testing/artifacts"
          python3 -c 'from testing.harness import Harness, JarvisClient; print("testing.harness imports")'
          # No --wait: this boots the whole stack, proves /healthz and the token,
          # prints the description and tears everything down again.
          python3 testing/harness/harness.py \
            --host 0.0.0.0 \
            --work-dir "$GITHUB_WORKSPACE/testing/artifacts/preflight" \
            --json-out "$GITHUB_WORKSPACE/testing/artifacts/preflight.json"
          python3 -c 'import json; d=json.load(open("testing/artifacts/preflight.json")); print("harness booted on", d["base_url"], "ports", d["ports"])'

      - name: Desktop end-to-end (jarvis-desktop/tests_e2e)
        env:
          # tests_e2e/conftest.py reads this (or JARVIS_HARNESS_WORK_DIR) and
          # puts the harness, the agent and the workspaces underneath it, which
          # is what makes a failed job uploadable.
          JARVIS_DESKTOP_E2E_WORK_DIR: ${{ github.workspace }}/testing/artifacts/desktop-e2e
          JARVIS_HARNESS_KEEP: "1"
        run: |
          set -uo pipefail
          # `set -uo pipefail` does NOT clear errexit, and GitHub runs every
          # `run:` block as `bash -e {0}` — so without this the shell exits the
          # instant pytest returns non-zero, `status=$?` never executes, and
          # the log tail below is dead code that has never once run. Turning
          # errexit off explicitly is what makes the failure path reachable;
          # every command from here on is checked by hand.
          set +e
          if [ ! -d jarvis-desktop/tests_e2e ]; then
            echo "::error::jarvis-desktop/tests_e2e does not exist — the desktop end-to-end suite is missing"
            exit 1
          fi
          junit="$GITHUB_WORKSPACE/testing/artifacts/desktop-e2e-junit.xml"
          python -m pytest jarvis-desktop/tests_e2e -v --color=yes --junitxml="$junit"
          status=$?

          if [ "$status" != "0" ]; then
            echo "::error::the desktop end-to-end suite failed (pytest exit $status); see artifact desktop-e2e-artifacts"
            while IFS= read -r log; do
              echo "----- $log (last 60 lines) -----"
              tail -n 60 "$log"
            done < <(find "$GITHUB_WORKSPACE/testing/artifacts" -name '*.log' -type f 2>/dev/null | sort)
            exit "$status"
          fi

          # A suite that skipped everything exits 0. conftest.py skips the whole
          # session when testing.harness will not import, which is precisely the
          # CI misconfiguration this job exists to catch — so a green pytest is
          # not on its own good enough.
          python3 - "$junit" <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = root.iter("testsuite")
          total = skipped = 0
          for suite in suites:
              total += int(suite.get("tests", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"desktop end-to-end: {total} test(s), {skipped} skipped")
          # ::error:: on stdout, then a plain exit code: workflow commands are
          # read from the step's stdout, and sys.exit(str) writes to stderr.
          if total == 0:
              print("::error::pytest collected no desktop end-to-end tests")
              sys.exit(1)
          if total == skipped:
              print(
                  "::error::every desktop end-to-end test skipped, so nothing was "
                  "proved. The usual cause is that testing.harness would not import "
                  "or the harness could not boot; see the skip reasons above."
              )
              sys.exit(1)
          PY
          # errexit is off, so say what this step's result is rather than
          # inheriting whatever the last command happened to return.
          exit $?

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-artifacts
          path: testing/artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          set -u
          {
            echo '### e2e · desktop agent'
            echo ''
            echo 'Ran `jarvis-desktop/tests_e2e`: a real `python -m jarvis_desktop`'
            echo 'against a real `jarvis-core`, over the real device channel. The'
            echo 'agent registers, reports presence, takes commands and applies its'
            echo 'own tier policy — through a TCP proxy the suite can cut to exercise'
            echo 'the reconnect path.'
            echo ''
            echo 'Artifact **desktop-e2e-artifacts**: the generated config, every'
            echo 'harness and agent log, and `desktop-e2e-junit.xml`.'
          } >> "$GITHUB_STEP_SUMMARY"
