name: CI

# Fast feedback on every push: the whole test estate except the things that
# genuinely need hardware (a GrapheneOS phone, real Wyoming/Ollama containers,
# a GPU). Those are listed in docs/verification.md and run by the operator.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python · ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: jarvis-core,    dir: jarvis-core,    paths: "tests" }
          - { name: jarvis-desktop, dir: jarvis-desktop, paths: "tests" }
          - { name: jarvis-browser, dir: jarvis-browser, paths: "tests" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: ${{ matrix.suite.dir }}
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e . || python -m pip install .; fi

      - name: Run tests
        working-directory: ${{ matrix.suite.dir }}
        run: python -m pytest ${{ matrix.suite.paths }} -q

  legacy-suites:
    name: python · tools/orchestrator/sandbox/evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install pytest pytest-asyncio fastapi httpx pyyaml
      - run: python -m pytest jarvis_tools/tests jarvis-orchestrator/tests jarvis-sandbox/tests -q
      - name: Routing eval (runs from its own dir for imports)
        working-directory: evals
        run: python -m pytest test_routing.py -q

  android-specs:
    name: android · executable specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run the Kotlin logic mirrors
        run: |
          set -eu
          # The Android code cannot be compiled without the SDK in this job, so
          # the pure logic (policy tiers, geofence, schedule math, task
          # variables, screen pruning, channel rules) has runnable python
          # mirrors that act as its executable specification.
          fail=0
          for t in android-app/tools/*.py; do
            echo "--- $t"
            python3 "$t" || fail=1
          done
          exit $fail

  web:
    name: web · build + unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jarvis-web/package-lock.json

      - name: Install
        working-directory: jarvis-web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: jarvis-web
        run: npm run build

      - name: Unit tests
        working-directory: jarvis-web
        run: npm test

      - name: Install Playwright chromium
        working-directory: jarvis-web
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        working-directory: jarvis-web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: jarvis-web/playwright-report
          retention-days: 7

  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyyaml

      - name: Shell scripts parse
        run: |
          set -eu
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "SYNTAX: $s"; fail=1; }
          done < <(find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*')
          exit $fail

      - name: Python files compile
        run: |
          set -eu
          python -m compileall -q jarvis-core/jarvis jarvis-desktop jarvis-browser \
            jarvis-orchestrator/app jarvis-sandbox jarvis_tools evals scripts \
            android-app/tools

      # A mutation stub reached main once: PolicyEngine.effective_tier was
      # replaced with `requested_tier or local_tier  # MUTANT: ...` and pushed,
      # which let a server LOWER a device-side tier. The unit tests caught it;
      # nobody re-ran them before committing. Deliberately weakened code is
      # marked, so refuse to carry the marker regardless of what the tests say.
      - name: No mutation-test stubs in the tree
        run: |
          python - <<'PY'
          import pathlib, re, sys

          MARKER = re.compile(r"\bMUTANT\b|\bDELIBERATELY BROKEN\b", re.I)
          SKIP_DIRS = {"node_modules", ".git", "build", ".svelte-kit", "__pycache__"}
          SUFFIXES = {".py", ".kt", ".kts", ".ts", ".js", ".svelte", ".sh", ".yml", ".yaml"}

          hits = []
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file() or p.suffix not in SUFFIXES:
                  continue
              if set(p.parts) & SKIP_DIRS:
                  continue
              # This workflow names the marker in order to ban it.
              if p == pathlib.Path(".github/workflows/ci.yml"):
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  if MARKER.search(line):
                      hits.append(f"{p}:{n}: {line.strip()}")

          if hits:
              print("Mutation-test stubs must never be committed:")
              print("\n".join(hits))
              sys.exit(1)
          print("no mutation markers")
          PY

      - name: YAML parses (custom tags tolerated)
        run: |
          python - <<'PY'
          import sys, pathlib, yaml

          class L(yaml.SafeLoader):
              pass

          # Jarvis/HA config tags are resolved at runtime, not by a linter.
          for tag in ("!secret", "!env_var", "!include", "!include_dir_named",
                      "!include_dir_merge_named", "!include_dir_list",
                      "!include_dir_merge_list"):
              L.add_constructor(tag, lambda ldr, node: None)

          bad = []
          for p in pathlib.Path(".").rglob("*.y*ml"):
              if any(x in p.parts for x in ("node_modules", ".git", "build", ".svelte-kit")):
                  continue
              try:
                  list(yaml.load_all(p.read_text(), Loader=L))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad) if bad else "all YAML parsed")
          sys.exit(1 if bad else 0)
          PY

      - name: Workflow files are valid (no duplicate keys)
        run: |
          python - <<'PY'
          import sys, pathlib, yaml

          # A duplicate mapping key is legal YAML (last wins) but makes GitHub
          # reject a workflow outright — it then runs ZERO jobs and names the
          # run after the file, which looks like a mysterious failure. A plain
          # yaml.safe_load cannot catch it, so fail loudly on duplicates here.
          class StrictLoader(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise yaml.constructor.ConstructorError(
                          None, None, f"duplicate key {key!r}", key_node.start_mark
                      )
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          StrictLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicates
          )

          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  doc = yaml.load(p.read_text(), Loader=StrictLoader)
              except Exception as e:
                  bad.append(f"{p}: {e}")
                  continue
              if not doc or "jobs" not in doc:
                  bad.append(f"{p}: no jobs block")
              # `on` parses as the boolean True in YAML 1.1
              if True not in doc and "on" not in doc:
                  bad.append(f"{p}: no trigger block")
          print("\n".join(bad) if bad else "workflow files OK")
          sys.exit(1 if bad else 0)
          PY

      - name: Compose files are valid
        run: |
          set -eu
          for f in docker-compose.yml jarvis-core/docker-compose.yml; do
            [ -f "$f" ] || continue
            echo "--- $f"
            docker compose -f "$f" config -q && echo "ok"
          done
