name: CI

# Fast feedback: the whole test estate except the things that genuinely need
# hardware (a GrapheneOS phone, real Wyoming/Ollama containers, a GPU). Those
# are listed in docs/verification.md and run by the operator.
#
# ONE RUN PER CHANGE
# ------------------
# This used to be `push: branches: ["**"]` next to a bare `pull_request:`, which
# fired the entire suite TWICE for every in-repo pull request — once for the
# branch push and once for the merge ref. The two runs even had different
# concurrency groups (`refs/heads/x` versus `refs/pull/N/merge`), so neither
# cancelled the other and both went to completion.
#
# So: `push` covers the integration branches, `pull_request` covers everything
# on its way to them, and the two do not overlap. A feature branch with no pull
# request open gets no run — open one, or use `workflow_dispatch`. Every
# workflow in this directory uses this same shape.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Read-only by default. Nothing here publishes, comments or tags; a job that
# needs more should ask for it by name rather than inherit a write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python · ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: jarvis-core,    dir: jarvis-core,    paths: "tests" }
          - { name: jarvis-desktop, dir: jarvis-desktop, paths: "tests" }
          - { name: jarvis-browser, dir: jarvis-browser, paths: "tests" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Per suite, not shared. Without this the three matrix legs compute
          # one cache key from every requirements.txt in the repo, so a change
          # to jarvis-browser's dependencies invalidates jarvis-core's cache.
          cache-dependency-path: ${{ matrix.suite.dir }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.suite.dir }}
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-timeout
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e . || python -m pip install .; fi

      # --timeout is not belt-and-braces, it is the difference between a red
      # build and a silent one. Two tests in jarvis-core's voice suite parked
      # forever on 3.12 (`Server.wait_closed()` waits for accepted connections
      # there, not just the listener), and the job hit its 20-minute limit and
      # was reported as `cancelled` — which reads like someone pushed over it,
      # not like a failure. 1253 tests quietly stopped being checked. With this,
      # a hang is one named failing test and the rest of the suite still runs.
      - name: Run tests
        working-directory: ${{ matrix.suite.dir }}
        run: |
          set -uo pipefail
          # The job log needs a token to read; the check run's annotations do
          # not. A failing test is named on the check run, so a red job can be
          # reproduced from the public API. (`-rfE`: pytest's own FAILED and
          # ERROR lines. `-rf` alone hid every error: twice on 27 Aug a red
          # core leg carried nothing but "exit code 1", because a test that
          # errored in setup or teardown is not a FAILED row, and `-r` with an
          # explicit letter drops pytest's default `E`.)
          python -m pytest ${{ matrix.suite.paths }} -q -rfE --timeout=120 --timeout-method=signal 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # `|| true`: the default shell here is `bash -e`, and with pipefail a
          # grep that finds no FAILED line — every green run — returned 1 and
          # took the job down with it (three green suites went red on 69da624).
          grep -E '^(FAILED|ERROR) ' pytest.log | head -n 30 | sed 's/^/::error::/' || true
          # A red with no FAILED or ERROR row — pytest exiting 1 with no
          # summary (twice on 27 Aug, 11:24 UTC among them, on a run that
          # took its usual four minutes) — leaves nothing on the check run
          # to reproduce from without a token for the job log. The tail is
          # where pytest says what it died of.
          if [ "$status" != "0" ] && ! grep -qE '^(FAILED|ERROR) ' pytest.log; then
            tail -n 25 pytest.log | sed 's/^/::error::tail: /' || true
          fi
          exit "$status"

  legacy-suites:
    name: python · orchestrator/sandbox/evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis-orchestrator/requirements.txt
      # From the orchestrator's own requirements rather than a hand-written
      # `fastapi httpx pyyaml`, which pinned nothing and drifted the moment the
      # service pinned anything: CI was testing whatever versions pip felt like
      # that morning, against a service that ships exact pins.
      - name: Install
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install -r jarvis-orchestrator/requirements.txt
          python -m pip install pytest pytest-asyncio pytest-timeout pyyaml
      - run: python -m pytest jarvis-orchestrator/tests jarvis-sandbox/tests -q --timeout=120 --timeout-method=signal
      # BOTH evals. `test_resolution.py` — does "the kitchen lamp" find the
      # kitchen lamp — has a make target, is listed in the README, and was
      # never run by CI: only the routing eval was. It is the one that catches
      # a matcher regression, which is the failure a user notices first.
      - name: Evals (run from their own dir for imports)
        working-directory: evals
        run: python -m pytest test_routing.py test_resolution.py -q --timeout=120 --timeout-method=signal

  android-specs:
    name: android · executable specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run the Kotlin logic mirrors
        run: |
          set -eu
          # The Android code cannot be compiled without the SDK in this job, so
          # the pure logic (policy tiers, geofence, schedule math, task
          # variables, screen pruning, channel rules) has runnable python
          # mirrors that act as its executable specification.
          fail=0
          for t in android-app/tools/*.py; do
            echo "--- $t"
            python3 "$t" || fail=1
          done
          exit $fail

  web:
    name: web · build + unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jarvis-web/package-lock.json

      - name: Install
        working-directory: jarvis-web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: jarvis-web
        run: npm run build

      - name: Unit tests
        working-directory: jarvis-web
        run: npm test

      # The one check that drives the real client over a real socket against the
      # mock backend, measuring the pipeline end to end. `make test-web` has run
      # it since it was written; CI never did, so the contract between
      # `pipeline.ts` and jarvis-core's event vocabulary was only ever checked
      # on somebody's laptop.
      - name: Pipeline smoke over a real socket
        working-directory: jarvis-web
        run: node ../tests/web/smoke.test.mjs

      - name: Install Playwright chromium
        working-directory: jarvis-web
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        working-directory: jarvis-web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: jarvis-web/playwright-report
          retention-days: 7

  lint:
    name: lint · ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Pinned, because a linter that changes its mind between two runs of the
      # same commit turns a green branch red for reasons nobody pushed.
      - run: python -m pip install "ruff==0.16.3"
      # The ruleset is defect-only and is argued for in ruff.toml: undefined
      # names, dead imports and locals, mutable default arguments, closures
      # that capture a loop variable. No formatting, no line length, no import
      # order — the eight real findings this turned up on its first run would
      # have been invisible under a thousand lines of style noise.
      - run: ruff check .

  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyyaml pytest pytest-timeout

      # 151 assertions about the workflow files themselves — the shell each
      # block will really be run by, which artifacts upload on failure, whether
      # the compose job covers every service in the stack. They existed, they
      # ran in milliseconds, and nothing in CI ever executed them: `testing/`
      # was not named by any job. A broken `script:` block was therefore caught
      # only in CI, tens of minutes into an emulator boot, as a bare exit code.
      - name: Workflow contract
        run: >-
          python -m pytest testing/e2e/test_ci_workflow_contract.py
          -q --timeout=120 --timeout-method=signal

      - name: Shell scripts parse
        run: |
          set -eu
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "SYNTAX: $s"; fail=1; }
          done < <(find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*')
          exit $fail

      - name: Python files compile
        run: |
          set -eu
          python -m compileall -q jarvis-core/jarvis jarvis-desktop jarvis-browser \
            jarvis-orchestrator/app jarvis-sandbox evals scripts \
            android-app/tools

      # A mutation stub reached main once: PolicyEngine.effective_tier was
      # replaced with `requested_tier or local_tier  # MUTANT: ...` and pushed,
      # which let a server LOWER a device-side tier. The unit tests caught it;
      # nobody re-ran them before committing. Deliberately weakened code is
      # marked, so refuse to carry the marker regardless of what the tests say.
      - name: No mutation-test stubs in the tree
        run: |
          python - <<'PY'
          import pathlib, re, sys

          MARKER = re.compile(r"\bMUTANT\b|\bDELIBERATELY BROKEN\b", re.I)
          SKIP_DIRS = {"node_modules", ".git", "build", ".svelte-kit", "__pycache__"}
          SUFFIXES = {".py", ".kt", ".kts", ".ts", ".js", ".svelte", ".sh", ".yml", ".yaml"}

          hits = []
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file() or p.suffix not in SUFFIXES:
                  continue
              if set(p.parts) & SKIP_DIRS:
                  continue
              # This workflow names the marker in order to ban it.
              if p == pathlib.Path(".github/workflows/ci.yml"):
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  if MARKER.search(line):
                      hits.append(f"{p}:{n}: {line.strip()}")

          if hits:
              print("Mutation-test stubs must never be committed:")
              print("\n".join(hits))
              sys.exit(1)
          print("no mutation markers")
          PY

      - name: YAML parses (custom tags tolerated)
        run: |
          python - <<'PY'
          import sys, pathlib, yaml

          class L(yaml.SafeLoader):
              pass

          # Jarvis/HA config tags are resolved at runtime, not by a linter.
          for tag in ("!secret", "!env_var", "!env_url", "!include", "!include_dir_named",
                      "!include_dir_merge_named", "!include_dir_list",
                      "!include_dir_merge_list"):
              L.add_constructor(tag, lambda ldr, node: None)

          bad = []
          for p in pathlib.Path(".").rglob("*.y*ml"):
              if any(x in p.parts for x in ("node_modules", ".git", "build", ".svelte-kit")):
                  continue
              try:
                  list(yaml.load_all(p.read_text(), Loader=L))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad) if bad else "all YAML parsed")
          sys.exit(1 if bad else 0)
          PY

      # The duplicate-key check that used to be inlined here is now
      # `test_a_workflow_has_no_duplicate_keys_and_declares_jobs_and_a_trigger`
      # in the workflow-contract suite above — same assertion, next to the
      # 144 others about these files, instead of a second copy that had to
      # be kept in step with it by hand.

      - name: Compose files are valid
        run: |
          set -eu
          for f in docker-compose.yml jarvis-core/docker-compose.yml; do
            [ -f "$f" ] || continue
            echo "--- $f"
            docker compose -f "$f" config -q && echo "ok"
          done
