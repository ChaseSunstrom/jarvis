name: Build Jarvis APK

# Builds the STANDALONE Jarvis Android app (android-app/, package ai.jarvis.app).
# No Home Assistant fork, no Google Play Services, no Firebase — so this is now
# a plain Gradle build of our own project rather than a 25-minute compile of
# somebody else's app.
#
# Debug builds need no secrets and install directly: run the workflow, then
# download the APK from the run's Artifacts.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug (no secrets, installable) or release (signed)"
        required: false
        default: "debug"
        type: choice
        options: ["debug", "release"]
  # Build (and publish an installable artifact) whenever the app changes, so
  # there is always a current APK to download without dispatching by hand.
  # NOTE: exactly ONE `push:` key — a duplicate is silently deduped by most
  # YAML parsers but makes GitHub reject the whole workflow (it then runs zero
  # jobs and names the run after the file). `paths` cannot be applied per-ref,
  # so releases come in via the `release` event below, which has no path filter.
  push:
    branches: ["**"]
    paths: ["android-app/**", ".github/workflows/android-apk.yml"]
  release:
    types: [published]

permissions:
  contents: write # attach the APK to a Release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    env:
      # A published release gets a signed build; everything else defaults to
      # debug (installable, needs no secrets).
      BUILD_TYPE: ${{ github.event_name == 'release' && 'release' || (github.event.inputs.build_type || 'debug') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The repo ships gradle-wrapper.properties but not the wrapper JAR
          # (a binary we deliberately don't commit), so the action provides
          # Gradle and we invoke it directly instead of ./gradlew.
          gradle-version: "8.10"

      - name: Assemble
        run: |
          set -eu
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Package + sign
        id: apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          OUTDIR="app/build/outputs/apk/$BUILD_TYPE"
          ls -la "$OUTDIR"
          SRC="$(ls "$OUTDIR"/*.apk | head -n1)"

          BTDIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          export PATH="$BTDIR:$PATH"

          if [ "$BUILD_TYPE" = "debug" ]; then
            OUT="jarvis-debug.apk"          # already signed with the debug key
            cp "$SRC" "$OUT"
          else
            if [ -n "${KEYSTORE_B64:-}" ]; then
              echo "$KEYSTORE_B64" | base64 -d > ks.jks
            else
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — signing with an EPHEMERAL key. The APK installs, but in-place updates (Obtainium) will need an uninstall first. See android-app/README.md."
              KS_PASS=jarvis; KEY_ALIAS=jarvis; KEY_PASS=jarvis
              keytool -genkeypair -v -keystore ks.jks -alias "$KEY_ALIAS" \
                -keyalg RSA -keysize 4096 -validity 10000 \
                -storepass "$KS_PASS" -keypass "$KEY_PASS" \
                -dname "CN=Jarvis, OU=Jarvis, O=Jarvis, C=US"
            fi
            zipalign -f 4 "$SRC" aligned.apk
            OUT="jarvis-release.apk"
            apksigner sign --ks ks.jks --ks-pass "pass:${KS_PASS}" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASS}" \
              --out "$OUT" aligned.apk
            apksigner verify --print-certs "$OUT" || true
            rm -f ks.jks aligned.apk
          fi

          PKG="$("$BTDIR/aapt" dump badging "$OUT" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          echo "path=android-app/$OUT" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

          {
            echo "### Jarvis APK ready ($BUILD_TYPE)"
            echo ""
            echo "- File: \`$OUT\`  ·  Package: \`$PKG\`"
            echo ""
            echo "Install, then grant the assistant role (GrapheneOS clears it on every update):"
            echo '```bash'
            echo "adb install -r $OUT"
            echo "adb shell settings put secure assistant $PKG/ai.jarvis.app.JarvisAssistActivity"
            echo "adb shell settings put secure voice_interaction_service $PKG/ai.jarvis.app.assist.JarvisVoiceInteractionService"
            echo "adb shell settings put secure assist_gesture_enabled 1"
            echo '```'
            echo ""
            echo "Then open Jarvis → Settings and point it at your jarvis-core URL + token."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "# Package: $PKG"
            echo "adb install -r $OUT"
            echo "adb shell settings put secure assistant $PKG/ai.jarvis.app.JarvisAssistActivity"
            echo "adb shell settings put secure voice_interaction_service $PKG/ai.jarvis.app.assist.JarvisVoiceInteractionService"
            echo "adb shell settings put secure assist_gesture_enabled 1"
          } > adb-setup.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ env.BUILD_TYPE }}-apk
          path: |
            ${{ steps.apk.outputs.path }}
            android-app/adb-setup.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Jarvis $TAG" \
              --notes "Standalone Jarvis APK. Package: ${{ steps.apk.outputs.pkg }}"
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" android-app/adb-setup.txt --clobber
