name: Build Jarvis APK

# Builds the STANDALONE Jarvis Android app (android-app/, package ai.jarvis.app).
# No Home Assistant fork, no Google Play Services, no Firebase — so this is now
# a plain Gradle build of our own project rather than a 25-minute compile of
# somebody else's app.
#
# Debug builds need no secrets and install directly: run the workflow, then
# download the APK from the run's Artifacts.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug (no secrets, installable) or release (signed)"
        required: false
        default: "debug"
        type: choice
        options: ["debug", "release"]
  # Build (and publish an installable artifact) whenever the app changes, so
  # there is always a current APK to download without dispatching by hand.
  # NOTE: exactly ONE `push:` key — a duplicate is silently deduped by most
  # YAML parsers but makes GitHub reject the whole workflow (it then runs zero
  # jobs and names the run after the file). `paths` cannot be applied per-ref,
  # so releases come in via the `release` event below, which has no path filter.
  push:
    branches: [main, dev]
    paths: &paths ["android-app/**", ".github/workflows/android-apk.yml"]
  pull_request:
    branches: [main, dev]
    paths: *paths
  release:
    types: [published]

permissions:
  contents: write # attach the APK to a Release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    env:
      # Anything published — a tagged release, or the per-push prerelease below
      # — must be a `release` build, because that is the only path that signs
      # with a STABLE key.
      #
      # A debug APK is signed with the runner's `~/.android/debug.keystore`,
      # which Android generates on first use and which is therefore different
      # on every CI machine. Publishing those would produce a stream of APKs
      # that each refuse to install over the last one, and the failure surfaces
      # only at the very end, in the system installer, as "app not installed".
      # Hand-dispatched builds keep the choice.
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type || 'debug') || 'release' }}
      # Every build must be newer than the last one or the in-app updater has
      # nothing to compare: Android refuses a package whose versionCode is not
      # greater than the installed one. `run_number` is monotonic per workflow
      # and never reused, which is exactly the property needed.
      JARVIS_VERSION_CODE: ${{ github.run_number }}
      JARVIS_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The repo ships gradle-wrapper.properties but not the wrapper JAR
          # (a binary we deliberately don't commit), so the action provides
          # Gradle and we invoke it directly instead of ./gradlew.
          gradle-version: "8.10"

      - name: Assemble
        run: |
          set -eu
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      # `assemble` never touches src/test, so those sources could rot
      # indefinitely without anyone noticing. Run them — compiling alone proves
      # they still build, which is not the same as proving they still pass, and
      # the pure-logic classes they cover (URL/endpoint resolution, release
      # picking, policy tiering) are exactly the ones where a silent regression
      # is expensive and a device is not needed to catch it.
      - name: Unit tests (src/test)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      # Wrong Build.VERSION.SDK_INT guards are invisible to the compiler and
      # only bite on a real device (minSdk is 29). Lint is the only thing that
      # can see them, so run it and surface the report. Non-blocking for now —
      # it is reported, not enforced, until the existing findings are triaged.
      - name: Lint (reported, not enforced)
        continue-on-error: true
        run: gradle :app:lintDebug --no-daemon || true

      - name: Summarise lint findings
        continue-on-error: true
        run: |
          set -u
          REPORT="app/build/reports/lint-results-debug.xml"
          [ -f "$REPORT" ] || { echo "no lint report produced"; exit 0; }
          python3 - "$REPORT" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, sys, xml.etree.ElementTree as ET
          issues = collections.Counter()
          newapi = []
          for issue in ET.parse(sys.argv[1]).getroot().iter("issue"):
              sev, ident = issue.get("severity"), issue.get("id")
              issues[(sev, ident)] += 1
              if ident in ("NewApi", "InlinedApi", "UnsafeNewApiCall"):
                  loc = issue.find("location")
                  newapi.append(f"- `{loc.get('file','?').split('/')[-1]}:"
                                f"{loc.get('line','?')}` {issue.get('message','')}")
          print("### Android lint")
          print(f"\n{sum(issues.values())} findings\n")
          for (sev, ident), n in issues.most_common(15):
              print(f"- {sev} **{ident}** x{n}")
          if newapi:
              print(f"\n#### API-level findings (minSdk 29) — {len(newapi)}\n")
              print("\n".join(newapi[:40]))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android-app/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Package + sign
        id: apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          OUTDIR="app/build/outputs/apk/$BUILD_TYPE"
          ls -la "$OUTDIR"
          SRC="$(ls "$OUTDIR"/*.apk | head -n1)"

          BTDIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          export PATH="$BTDIR:$PATH"

          if [ "$BUILD_TYPE" = "debug" ]; then
            OUT="jarvis-debug.apk"          # already signed with the debug key
            cp "$SRC" "$OUT"
          else
            if [ -n "${KEYSTORE_B64:-}" ]; then
              echo "$KEYSTORE_B64" | base64 -d > ks.jks
            else
              # The committed CI key, NOT an ephemeral one. A fresh key per run
              # produces APKs that cannot install over each other — Android
              # refuses a signature change — which would make the in-app
              # updater permanently useless while looking like it worked right
              # up to the install prompt. Its password is in the repo on
              # purpose; see android-app/README.md for what that does and does
              # not protect, and set ANDROID_KEYSTORE_BASE64 to supersede it.
              echo "::notice::Signing with the committed CI key (android-app/ci-keystore.jks). Set ANDROID_KEYSTORE_BASE64 to use your own."
              cp ci-keystore.jks ks.jks
              KS_PASS=jarvis; KEY_ALIAS=jarvis; KEY_PASS=jarvis
            fi
            zipalign -f 4 "$SRC" aligned.apk
            OUT="jarvis-release.apk"
            apksigner sign --ks ks.jks --ks-pass "pass:${KS_PASS}" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASS}" \
              --out "$OUT" aligned.apk
            apksigner verify --print-certs "$OUT" || true
            rm -f ks.jks aligned.apk
          fi

          PKG="$("$BTDIR/aapt" dump badging "$OUT" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          echo "path=android-app/$OUT" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

          {
            echo "### Jarvis APK ready ($BUILD_TYPE)"
            echo ""
            echo "- File: \`$OUT\`  ·  Package: \`$PKG\`"
            echo ""
            echo "Install, then grant the assistant role (GrapheneOS clears it on every update):"
            echo '```bash'
            echo "adb install -r $OUT"
            echo "adb shell settings put secure assistant $PKG/ai.jarvis.app.JarvisAssistActivity"
            echo "adb shell settings put secure voice_interaction_service $PKG/ai.jarvis.app.assist.JarvisVoiceInteractionService"
            echo "adb shell settings put secure assist_gesture_enabled 1"
            echo '```'
            echo ""
            echo "Then open Jarvis → Settings and point it at your jarvis-core URL + token."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "# Package: $PKG"
            echo "adb install -r $OUT"
            echo "adb shell settings put secure assistant $PKG/ai.jarvis.app.JarvisAssistActivity"
            echo "adb shell settings put secure voice_interaction_service $PKG/ai.jarvis.app.assist.JarvisVoiceInteractionService"
            echo "adb shell settings put secure assist_gesture_enabled 1"
          } > adb-setup.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ env.BUILD_TYPE }}-apk
          path: |
            ${{ steps.apk.outputs.path }}
            android-app/adb-setup.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Jarvis $TAG" \
              --notes "Standalone Jarvis APK. Package: ${{ steps.apk.outputs.pkg }}"
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" android-app/adb-setup.txt --clobber

      # Every push that changes the app becomes an installable release, because
      # an artifact is not one: artifacts need a logged-in browser session and
      # expire, so a phone cannot fetch them. The in-app updater reads this.
      #
      # Marked prerelease, and the app only offers those when the user has
      # ticked "include test builds" — so a per-push build reaches somebody who
      # asked for per-push builds, and a hand-published release reaches
      # everyone. `+<versionCode>` in the tag is load-bearing: it is the only
      # way a client can know a release's version without downloading the whole
      # APK, and `release_feed_test.py` fails if it disappears.
      - name: Publish this build as a prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ env.JARVIS_VERSION_CODE }}
          VERSION_NAME: ${{ env.JARVIS_VERSION_NAME }}
        working-directory: .
        run: |
          set -eu
          TAG="v${VERSION_NAME}+${VERSION_CODE}"
          SHORT="$(git rev-parse --short HEAD)"

          NOTES="$(printf '%s\n' \
            "Automatic build of \`${GITHUB_REF_NAME}\` at \`${SHORT}\`." \
            "" \
            "- Package: \`${{ steps.apk.outputs.pkg }}\`" \
            "- versionCode: \`${VERSION_CODE}\`" \
            "" \
            "Installs over a previous Jarvis build without uninstalling, as long as" \
            "both were signed by the same key. Jarvis checks for these from" \
            "Settings when \"include test builds\" is on.")"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Jarvis ${VERSION_NAME}" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          gh release upload "$TAG" \
            "${{ steps.apk.outputs.path }}" android-app/adb-setup.txt --clobber
