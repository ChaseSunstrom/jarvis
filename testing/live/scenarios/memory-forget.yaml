name: memory-forget
capability: memory
gated-on: M15
intent: >
  Forgetting has to be real, and it has to be visible. A "forget" that only
  hides an entry from retrieval leaves it on disk, and the user who asked for
  it to be gone was told a lie.
variants: [text]
turns:
  - say: "Remember that my bank PIN reminder is the year I moved house."
    expect:
      reply_means: "confirms it has remembered that"
  - say: "Forget what I just told you about the PIN reminder."
    expect:
      reply_means: "confirms it has forgotten it"
  - say: "What did I tell you about my PIN reminder?"
    expect:
      reply_absent: ["moved house"]
      reply_means: "says it does not know or has nothing recorded about that"
