name: notes-append
capability: notes
gated-on: M92
intent: "A note grown over two turns: the second must land in the first, not beside it."
variants: [text]
setup:
  clear: [notes]
turns:
  - say: "Note that the boiler was serviced today."
    expect:
      note: {body_contains: "boiler"}
      capability: notes
  # Digits, not words: the model writes "1.4 bar" whatever was said, and the
  # note is asserted on what it wrote.
  - say: "Add to my boiler note that the pressure was 1.4 bar."
    expect:
      capability: notes
      note: {body_contains: "1.4"}
      reply_means: "confirms it added the pressure to the boiler note"
