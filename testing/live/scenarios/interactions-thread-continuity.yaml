name: interactions-thread-continuity
capability: interactions
gated-on: M17
intent: >
  One conversation, two surfaces. Started at the console and continued from the
  phone, the thread has to be the same thread — "it" in the second turn still
  means what it meant in the first, on a different client.
variants: [text]
turns:
  - say: "Turn on the bed light."
    expect:
      service: {domain: light, service: turn_on, entity_id: light.bed_light}
  - say: "And what did I just ask you to do?"
    expect:
      reply_contains: ["bed light"]
      reply_means: "recalls that it was asked to turn on the bed light"
