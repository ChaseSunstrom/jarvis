name: surface-by-voice
capability: surface
gated-on: M92
intent: >
  "Show me the garage temperature" puts a panel on the voice screen (M83) and
  "clear the screen" takes it down — the surface, by voice, asserted on the
  surface's own list rather than on the sentence.
variants: [voice, text]
setup:
  # The garage temperature is the rig's own sensor, announced here over MQTT
  # as a bridge would — sensors-discovered used to be the only scenario that
  # made it, and this one passed or failed on whether that had run first.
  mqtt_publish:
    - topic: homeassistant/sensor/jarvis_test_garage_temp/config
      retain: true
      payload:
        name: Garage Temperature
        unique_id: jarvis_test_garage_temp
        state_topic: jarvis-test/garage/temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
    - topic: jarvis-test/garage/temperature
      retain: true
      payload: "12.5"
turns:
  - say: "Show me the garage temperature on the screen."
    expect:
      capability: surface
      surface: {entity: sensor.garage_temperature, within: 20}
      reply_means: "says it has put the garage temperature up on the screen"
  - say: "Clear the screen."
    expect:
      capability: surface
      surface: {count: 0, within: 20}
      reply_means: "says the screen is cleared"
