name: house-media
capability: house
gated-on: M92
intent: "A speaker told to play, asserted on the service, not the sentence."
variants: [voice, text]
turns:
  - say: "Play something on the living room speaker."
    expect:
      service: {domain: media_player, entity_id: media_player.living_room_speaker}
      reply_means: "says the living room speaker is playing (or starting)"
      capability: house
