name: memory-reflection
capability: memory
gated-on: M87
ground: stack
intent: >
  Extraction keeps a fact the moment it is said and never looks back over a
  day, so the same fact lands twice in two wordings and nothing consolidates.
  Once a night Jarvis reads the day's conversations, asks once for the few
  durable facts that are not already known, keeps them as "learned", and says
  what it learned in a note and a card. Here the day is two turns and the
  night is the rig calling memory.reflect; then Jarvis is asked what it
  learned, and answers from the record.
variants: [text]
turns:
  - say: "My daughter is called Mira, and she is allergic to peanuts."
    expect:
      reply_means: "acknowledges it, as a note about the user's daughter, without inventing anything"
  - say: "What did you learn about me today?"
    reflect: true
    expect:
      memory: {recalls: "Mira"}
      notification: {kind: reflection, title_contains: "learned", within: 30}
      reply_means: >
        says it learned that the user's daughter Mira is allergic to peanuts
        (or names Mira and peanuts) — from what it remembers, not a guess
