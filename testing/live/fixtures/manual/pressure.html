<title>Pressure and filling — Vesper 24kW</title>
<h1>Pressure and filling</h1>
<p>The Vesper 24kW must not be operated above <b>2.5 bar</b>. The pressure
relief valve lifts at that point.</p>
<p>Cold fill pressure should be between 1.0 and 1.5 bar. Below 0.8 bar the
appliance locks out and displays F22.</p>
