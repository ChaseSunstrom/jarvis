[pytest]
# `python3 -m pytest testing/e2e -q` from the repo root finds this file as the
# nearest ini above the target directory, which is what makes rootdir and
# asyncio mode the same whether you run it from here or from the root.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = e2e
markers =
    e2e: drives a real jarvis-core through the harness
    slow: takes more than a couple of seconds
